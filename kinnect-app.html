<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#fcfcfb" />
<title>Kin·nect</title>
<style>
  :root{
    --surface-1:#fcfcfb;
    --page-plane:#f2f3f1;
    --ink-1:#0b0b0b;
    --ink-2:#52514e;
    --ink-muted:#898781;
    --gridline:#e1e0d9;
    --border:rgba(11,11,11,0.10);

    --blue:#2a78d6;
    --blue-deep:#184f95;
    --aqua:#1baf7a;
    --aqua-deep:#0f7a53;
    --violet:#4a3aa7;

    --good:#0ca30c;
    --warning:#c98500;
    --critical:#d03b3b;

    --good-bg:#e7f6e7;
    --warning-bg:#fdf0da;
    --critical-bg:#fbe7e6;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{ height:100%; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface-1);
    color: var(--ink-1);
    height:100%;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }

  #app{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background:var(--surface-1);
    max-width:560px;
    margin:0 auto;
    box-shadow:0 0 40px rgba(0,0,0,0.06);
  }

  .app-header{
    flex:0 0 auto;
    padding: calc(var(--safe-top) + 14px) 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--gridline);
    background:var(--surface-1);
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:18px; color:var(--ink-1);
  }
  .brand svg{ width:22px; height:22px; }
  .header-right{
    display:flex; align-items:center; gap:10px;
  }
  .avatar-mini{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#fff;
    background:var(--blue);
  }

  .app-body{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 20px 24px;
    -webkit-user-select:text;
    user-select:text;
  }
  .app-body::-webkit-scrollbar{ width:0; }

  .bottomnav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:var(--surface-1);
    border-top:1px solid var(--gridline);
    padding: 8px 4px calc(var(--safe-bottom) + 8px);
  }
  .bottomnav .navitem{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10.5px; color:var(--ink-muted); font-weight:600;
    background:none; border:none; cursor:pointer;
    padding:6px 10px;
    flex:1;
  }
  .bottomnav .navitem.active{ color:var(--blue); }
  .bottomnav .navitem svg{ width:22px; height:22px; }

  h2.screen-title{
    font-size:21px;
    margin:16px 0 4px;
    letter-spacing:-0.01em;
  }
  p.screen-sub{
    margin:0 0 18px;
    color:var(--ink-2);
    font-size:14px;
    line-height:1.5;
  }

  /* ---- Upload screen ---- */
  .upload-actions{ display:flex; gap:10px; margin-bottom:18px; }
  .upload-actions button{
    flex:1;
    border:none;
    border-radius:14px;
    padding:16px 8px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .btn-primary-fill{ background:var(--blue); color:#fff; }
  .btn-secondary-fill{ background:#eaf1fb; color:var(--blue-deep); }

  .thumb-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:20px;
  }
  .thumb{
    aspect-ratio:3/4;
    border-radius:10px;
    background:#e9ebe8;
    border:1px solid var(--gridline);
    display:flex;
    align-items:flex-end;
    padding:6px;
    font-size:10.5px;
    font-weight:700;
    color:var(--ink-muted);
    position:relative;
  }
  .thumb.add{
    align-items:center;
    justify-content:center;
    color:var(--blue);
    font-size:24px;
    font-weight:400;
    border-style:dashed;
    cursor:pointer;
  }
  .thumb .pagebadge{
    position:absolute; top:6px; right:6px;
    background:rgba(255,255,255,0.85);
    border-radius:6px;
    padding:1px 5px;
    font-size:9.5px;
  }
  .thumb.bottle{ background:#eaf1fb; }
  .thumb.discharge{ background:#f4efe3; }
  .thumb .typeicon{
    position:absolute; top:6px; left:6px;
    font-size:14px;
    background:rgba(255,255,255,0.85);
    border-radius:6px;
    padding:1px 5px;
  }
  .thumb .typelabel{
    font-size:9.5px;
    font-weight:700;
    color:var(--ink-2);
  }
  .thumb .removeb{
    position:absolute; bottom:6px; right:6px;
    background:rgba(255,255,255,0.9);
    border-radius:6px;
    padding:0 5px;
    font-size:11px;
    color:var(--critical);
    cursor:pointer;
  }
  .upload-hint{
    font-size:11.5px;
    color:var(--ink-muted);
    margin:-10px 0 16px;
    line-height:1.4;
  }

  .cta-bar{
    flex:0 0 auto;
    padding:10px 20px calc(var(--safe-bottom) + 10px);
    background:var(--surface-1);
    border-top:1px solid var(--gridline);
  }
  .cta-btn{
    width:100%;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(42,120,214,0.35);
  }
  .cta-btn:disabled{ opacity:.5; cursor:default; box-shadow:none; }
  .cta-btn.ghost{
    background:transparent;
    color:var(--blue);
    box-shadow:none;
    border:1.5px solid var(--blue);
  }
  .cta-btn.static{ position:static; width:100%; }

  /* ---- Parsing screen ---- */
  .parse-wrap{
    display:flex; flex-direction:column; align-items:center;
    padding-top:30px;
  }
  .ring{
    width:120px; height:120px;
    border-radius:50%;
    background:conic-gradient(var(--blue) calc(var(--pct,0)*1%), var(--gridline) 0);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:22px;
    transition:background 0.3s;
  }
  .ring-inner{
    width:96px; height:96px;
    border-radius:50%;
    background:var(--surface-1);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:20px;
  }
  .steplist{ width:100%; }
  .step{
    display:flex; align-items:center; gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--gridline);
    font-size:14px;
    color:var(--ink-muted);
    font-weight:600;
  }
  .step:last-child{ border-bottom:none; }
  .step .dot{
    width:20px; height:20px; border-radius:50%;
    border:2px solid var(--gridline);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .step.done{ color:var(--ink-1); }
  .step.done .dot{ background:var(--good); border-color:var(--good); }
  .step.active .dot{ border-color:var(--blue); }
  .step.done .dot::after{ content:"✓"; color:#fff; font-size:11px; font-weight:900; }

  /* ---- Verification screen ---- */
  .verify-progress{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
    font-size:12.5px; font-weight:700; color:var(--ink-muted);
  }
  .bar-track{
    height:6px; background:var(--gridline); border-radius:4px;
    overflow:hidden; margin-bottom:16px;
  }
  .bar-fill{ height:100%; background:var(--blue); border-radius:4px; transition:width .3s; }

  .doc-card{
    background:#f4efe3;
    border:1px solid #e5dcc6;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size:12.5px;
    line-height:1.6;
    color:#4a4633;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
  }
  .doc-card .label{
    font-family:system-ui,sans-serif;
    font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:#8a7f5c; font-weight:700; margin-bottom:6px; display:block;
  }
  .doc-card mark{
    background:#ffe8a3;
    padding:0 2px;
    border-radius:3px;
  }

  .extract-card{
    background:var(--surface-1);
    border:1.5px solid var(--gridline);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
  }
  .extract-card .label{
    font-size:10px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); font-weight:700; margin-bottom:8px; display:flex;
    align-items:center; justify-content:space-between;
  }
  .confbadge{
    font-size:10px; font-weight:700; border-radius:999px; padding:2px 8px;
    text-transform:none; letter-spacing:0;
  }
  .confbadge.high{ background:var(--good-bg); color:var(--good); }
  .confbadge.low{ background:var(--warning-bg); color:var(--warning); }

  .field-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:7px 0;
    border-bottom:1px dashed var(--gridline);
    font-size:14px;
    gap:12px;
  }
  .field-row:last-child{ border-bottom:none; }
  .field-row .k{ color:var(--ink-muted); font-weight:600; }
  .field-row .v{ font-weight:700; text-align:right; }

  .verify-actions{ display:flex; gap:10px; margin-bottom:8px; }
  .btn-confirm{
    flex:1.4; background:var(--good); color:#fff; border:none;
    border-radius:12px; padding:14px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-edit{
    flex:1; background:transparent; color:var(--warning); border:1.5px solid var(--warning);
    border-radius:12px; padding:14px; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* ---- Edit modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.45);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-sheet{
    background:var(--surface-1);
    width:100%; max-width:560px;
    border-radius:20px 20px 0 0;
    padding:18px 20px calc(var(--safe-bottom) + 18px);
    max-height:80vh;
    overflow-y:auto;
  }
  .modal-sheet h3{ margin:0 0 4px; font-size:17px; }
  .modal-sheet p{ margin:0 0 16px; font-size:13px; color:var(--ink-muted); }
  .edit-row{ margin-bottom:12px; }
  .edit-row label{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  .edit-row input{
    width:100%; border:1.5px solid var(--gridline); border-radius:10px;
    padding:10px 12px; font-size:14px; font-family:inherit; color:var(--ink-1);
    background:#fff;
  }
  .edit-row input:focus{ outline:none; border-color:var(--blue); }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{
    flex:1; border:none; border-radius:12px; padding:13px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-modal-cancel{ background:var(--gridline); color:var(--ink-2); }
  .btn-modal-save{ background:var(--blue); color:#fff; }

  /* ---- Dashboard screen ---- */
  .fam-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:800; color:#fff;
    border:2px solid var(--surface-1);
    margin-left:-10px;
  }
  .fam-row .avatar:first-child{ margin-left:0; }
  .fam-label{ font-size:12.5px; color:var(--ink-muted); font-weight:600; margin-left:6px; }

  .stat-row{ display:flex; gap:10px; margin-bottom:20px; }
  .stat-tile{
    flex:1; background:var(--surface-1); border:1px solid var(--gridline);
    border-radius:12px; padding:12px;
  }
  .stat-tile .num{ font-size:24px; font-weight:800; line-height:1; }
  .stat-tile .lbl{ font-size:11px; color:var(--ink-muted); font-weight:600; margin-top:4px; }

  .section-h{
    font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-muted); margin:18px 0 8px;
  }

  .med-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-1); border:1px solid var(--gridline);
    border-radius:12px; padding:12px; margin-bottom:8px;
  }
  .checkbox{
    width:24px; height:24px; border-radius:50%;
    border:2px solid var(--gridline);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .checkbox.checked{ background:var(--good); border-color:var(--good); color:#fff; font-size:12px; font-weight:900; }
  .med-info{ flex:1; }
  .med-name{ font-weight:700; font-size:14px; }
  .med-sub{ font-size:12px; color:var(--ink-muted); }
  .status-chip{
    font-size:10.5px; font-weight:700; border-radius:999px; padding:3px 9px;
    white-space:nowrap;
  }
  .status-chip.taken{ background:var(--good-bg); color:var(--good); }
  .status-chip.due{ background:var(--warning-bg); color:var(--warning); }
  .status-chip.overdue{ background:var(--critical-bg); color:var(--critical); }

  .appt-card{
    background:var(--surface-1); border:1px solid var(--gridline);
    border-radius:12px; padding:12px; margin-bottom:8px;
    display:flex; gap:12px; align-items:center;
  }
  .appt-date{
    width:48px; text-align:center; flex:0 0 auto;
    background:#eaf1fb; border-radius:10px; padding:6px 0;
  }
  .appt-date .d{ font-size:17px; font-weight:800; color:var(--blue-deep); line-height:1; }
  .appt-date .m{ font-size:9.5px; font-weight:700; color:var(--blue-deep); text-transform:uppercase; }
  .appt-info .who{ font-weight:700; font-size:13.5px; }
  .appt-info .what{ font-size:12px; color:var(--ink-muted); }

  .alert-box{
    background:#eef6f2; border:1px solid #c9e4d8; border-radius:12px;
    padding:12px; margin-top:16px; font-size:12.5px; color:#1b5e42; line-height:1.5;
  }

  .instr-card{
    background:var(--surface-1); border:1px solid var(--gridline);
    border-radius:12px; padding:12px; margin-bottom:8px;
  }
  .instr-card .instr-head{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:13.5px; margin-bottom:6px;
  }
  .instr-card .instr-head .icon{ font-size:15px; }
  .instr-card .instr-row{
    display:flex; justify-content:space-between; gap:10px;
    font-size:12.5px; padding:3px 0; color:var(--ink-2);
  }
  .instr-card .instr-row .k{ color:var(--ink-muted); font-weight:600; }
  .instr-card .instr-row .v{ font-weight:700; text-align:right; }

  .empty-state{ text-align:center; padding-top:60px; }
  .empty-state .emoji{ font-size:44px; margin-bottom:10px; }

  .toast{
    position:fixed;
    left:50%; bottom:24px;
    transform:translateX(-50%) translateY(10px);
    background:var(--ink-1); color:#fff;
    padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:60;
    white-space:nowrap;
    max-width:88vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div id="app"></div>
  <div class="toast" id="toast"></div>

<script>
// ============================================================
// Kin-nect — real single-page app shell (mobile-first).
// Same demo logic as the earlier clickable prototype, now
// running full-screen the way it would on an actual phone,
// with real navigation (no phone-frame mockup, no tab strip).
// ============================================================

const NAV_ICONS = {
  dashboard: '<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/><path d="M10.5 12h3" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  upload: '<path d="M12 4v11M12 4l-4 4M12 4l4 4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  family: '<circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M15.5 14.2c2.2.4 3.9 2.1 3.9 4.8" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  settings: '<circle cx="12" cy="12" r="3" stroke-width="1.8" fill="none"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.3 6.3l1.5 1.5M16.2 16.2l1.5 1.5M6.3 17.7l1.5-1.5M16.2 7.8l1.5-1.5" stroke-width="1.6" stroke-linecap="round"/>'
};

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ---------- shared nav ----------
let currentScreen = 'upload';
const NAV_TABS = [
  {key:'dashboard', label:'Home'},
  {key:'upload', label:'Scan'},
  {key:'family', label:'Family'},
  {key:'settings', label:'Settings'}
];

function goTo(name){
  currentScreen = name;
  renderScreen(name);
}

// ---------- SCREEN: upload data ----------
// Each scanned page is tracked with its source type so the AI step,
// verification queue, and dashboard all reflect what was actually scanned.
let documents = [];
let pageCount = documents.length;

function renderThumbGrid(){
  const grid = document.getElementById('thumbGrid');
  if(!grid) return;
  let html = '';
  documents.forEach((doc,i)=>{
    const icon = doc.type === 'bottle' ? '💊' : '📄';
    const label = doc.type === 'bottle' ? 'Bottle' : 'Discharge';
    html += `<div class="thumb ${doc.type}">
      <span class="typeicon">${icon}</span>
      <span class="pagebadge">p.${i+1}</span>
      <span class="typelabel">${label}</span>
      <span class="removeb" onclick="removePage(${i}, event)">✕</span>
    </div>`;
  });
  html += `<div class="thumb add" onclick="addPage('discharge')">+</div>`;
  grid.innerHTML = html;
  pageCount = documents.length;
  refreshCta();
}
function refreshCta(){
  const btn = document.getElementById('processBtn');
  if(btn){
    btn.disabled = pageCount === 0;
    btn.textContent = pageCount === 0 ? 'Scan a document to begin' : `Process ${pageCount} page${pageCount>1?'s':''} with AI →`;
  }
}
function addPage(type){
  documents.push({type: type || 'discharge'});
  pageCount = documents.length;
  showToast(type === 'bottle' ? '📷 Bottle label captured' : '📷 Discharge page captured');
  renderThumbGrid();
}
function removePage(i, ev){
  if(ev) ev.stopPropagation();
  documents.splice(i,1);
  pageCount = documents.length;
  renderThumbGrid();
}
function startProcessing(){
  if(pageCount === 0) return;
  confirmedItems = [];
  verifyIdx = 0;
  verifyItems = generateVerifyItems(documents);
  goTo('parse');
  startParsing();
}

// ---------- SCREEN: parsing ----------
function getParseSteps(docs){
  const steps = ["Reading layout & tables"];
  if(docs.some(d=>d.type==='bottle')) steps.push("Reading prescription labels");
  if(docs.some(d=>d.type==='discharge')) steps.push("Extracting discharge instructions");
  steps.push("Cross-checking with the family dashboard");
  steps.push("Flagging anything unclear");
  return steps;
}
let parseSteps = [];
let parseTimer = null;
function renderStepList(activeIdx, doneCount){
  const el = document.getElementById('stepList');
  if(!el) return;
  el.innerHTML = parseSteps.map((s,i)=>{
    const cls = i < doneCount ? 'done' : (i===activeIdx ? 'active' : '');
    return `<div class="step ${cls}"><div class="dot"></div>${s}</div>`;
  }).join('');
}
function startParsing(){
  clearInterval(parseTimer);
  parseSteps = getParseSteps(documents);
  let doneCount = 0;
  renderStepList(0,0);
  const ring = document.getElementById('ring');
  const ringPct = document.getElementById('ringPct');
  const continueBtn = document.getElementById('parseContinue');
  if(continueBtn) continueBtn.style.display = 'none';
  parseTimer = setInterval(()=>{
    doneCount++;
    const pct = Math.round((doneCount/parseSteps.length)*100);
    if(ring) ring.style.setProperty('--pct', pct);
    if(ringPct) ringPct.textContent = pct+'%';
    renderStepList(doneCount, doneCount);
    if(doneCount >= parseSteps.length){
      clearInterval(parseTimer);
      if(continueBtn) continueBtn.style.display='block';
    }
  }, 600);
}

// ---------- SCREEN: verification ----------
// Sample content pools stand in for real OCR/NLP output. Each medicine
// bottle scanned pulls the next medication; each discharge page pulls the
// next instruction template, so the dashboard reflects what was scanned.
const bottleMeds = [
  {name:"Metoprolol Tartrate", dose:"25 mg", frequency:"Twice daily", qty:"60 tablets", refill:"1 refill left", pharmacy:"CVS Pharmacy #4471"},
  {name:"Atorvastatin", dose:"40 mg", frequency:"Once daily at bedtime", qty:"30 tablets", refill:"No refills left", pharmacy:"Walgreens #2210"},
  {name:"Furosemide", dose:"20 mg", frequency:"Once daily, morning", qty:"30 tablets", refill:"2 refills left", pharmacy:"CVS Pharmacy #4471"},
  {name:"Amoxicillin", dose:"500 mg", frequency:"Three times daily", qty:"21 capsules", refill:"Course completes 8/20", pharmacy:"CVS Pharmacy #4471"}
];
const dischargeTemplates = [
  {
    type:"Follow-up Appointment",
    snippet:"...Pt to follow up with <mark>Dr. R. Lee, Cardiology, Thurs 8/13 @ 2:00 PM</mark>, bring med list...",
    fields:[["Provider","Dr. R. Lee — Cardiology"],["Date","Thu, Aug 13"],["Time","2:00 PM"],["Bring","Current med list"]],
    confidence:"high"
  },
  {
    type:"Wound Care",
    snippet:"...keep incision <mark>clean &amp; dry, change dressing qd</mark>, watch for redness/drainage — illegible margin note...",
    fields:[["Instruction","Change dressing daily"],["Site","Abdominal incision"],["Watch for","Redness or drainage"],["Note","Margin text partly illegible"]],
    confidence:"low"
  },
  {
    type:"Red-Flag Symptom",
    snippet:"...call clinic or go to ER for <mark>fever &gt;101°F, chest pain, or shortness of breath</mark>...",
    fields:[["Call ER if","Fever over 101°F"],["Also watch","Chest pain"],["Also watch","Shortness of breath"]],
    confidence:"high"
  },
  {
    type:"Activity Restriction",
    snippet:"...no lifting <mark>over 10 lbs</mark> for 2 weeks, no driving while on <mark>opioid pain medication</mark>...",
    fields:[["Lifting limit","Under 10 lbs, 2 weeks"],["Driving","Not while on opioids"],["Stairs","OK, using the rail"]],
    confidence:"high"
  },
  {
    type:"Diet Instructions",
    snippet:"...resume <mark>low-sodium diet</mark>, encourage fluids, <mark>no alcohol</mark> while on antibiotics...",
    fields:[["Diet","Low-sodium"],["Fluids","Encourage"],["Alcohol","Avoid on antibiotics"]],
    confidence:"high"
  }
];

function generateVerifyItems(docs){
  let bIdx = 0, dIdx = 0;
  return docs.map(doc=>{
    if(doc.type === 'bottle'){
      const med = bottleMeds[bIdx % bottleMeds.length];
      bIdx++;
      return {
        type:"Medication",
        snippet:`...Label reads: <mark>${med.name} ${med.dose}</mark> — ${med.frequency}. Qty ${med.qty}. ${med.refill}. — ${med.pharmacy}...`,
        fields:[["Medication",med.name],["Dose",med.dose],["Frequency",med.frequency],["Refill",med.refill],["Pharmacy",med.pharmacy]],
        confidence:"high",
        med: Object.assign({}, med)
      };
    } else {
      const tpl = dischargeTemplates[dIdx % dischargeTemplates.length];
      dIdx++;
      return Object.assign({}, tpl, {fields: tpl.fields.map(f=>f.slice())});
    }
  });
}

let verifyItems = [];
let confirmedItems = [];
let verifyIdx = 0;
function renderVerifyStep(){
  if(verifyItems.length === 0){
    document.querySelector('.app-body').innerHTML = `
      <div class="empty-state">
        <div class="emoji">🧾</div>
        <h2 class="screen-title" style="margin-bottom:6px;">Nothing to verify yet</h2>
        <p class="screen-sub">Scan something first — Kin-nect will pull it through here before it reaches the dashboard.</p>
        <button class="cta-btn static" onclick="goTo('upload')">Go to Scan →</button>
      </div>`;
    return;
  }
  if(verifyIdx >= verifyItems.length){
    document.querySelector('.app-body').innerHTML = `
      <div style="text-align:center;padding-top:60px;">
        <div style="font-size:44px;margin-bottom:10px;">✅</div>
        <h2 class="screen-title" style="margin-bottom:6px;">All items confirmed</h2>
        <p class="screen-sub">${verifyItems.length} of ${verifyItems.length} verified. Your family dashboard is up to date.</p>
        <button class="cta-btn static" onclick="goTo('dashboard')">Open the Dashboard →</button>
      </div>`;
    return;
  }
  const item = verifyItems[verifyIdx];
  document.getElementById('vp-label').textContent = item.type;
  document.getElementById('vp-count').textContent = `Item ${verifyIdx+1} of ${verifyItems.length}`;
  document.getElementById('vp-bar').style.width = `${(verifyIdx/verifyItems.length)*100}%`;
  document.getElementById('vp-snippet').innerHTML = item.snippet;
  const confEl = document.getElementById('vp-conf');
  confEl.textContent = item.confidence === 'high' ? 'High confidence' : 'Please double-check';
  confEl.className = 'confbadge ' + (item.confidence === 'high' ? 'high' : 'low');
  document.getElementById('vp-fields').innerHTML = item.fields.map(f=>`<div class="field-row"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('');
}
function confirmVerify(){
  confirmedItems.push(verifyItems[verifyIdx]);
  verifyIdx++;
  showToast('✓ Saved to your dashboard');
  renderVerifyStep();
}
function openEditModal(){
  if(verifyIdx >= verifyItems.length) return;
  const item = verifyItems[verifyIdx];
  const rows = item.fields.map((f,i)=>`
    <div class="edit-row">
      <label>${f[0]}</label>
      <input type="text" id="edit-field-${i}" value="${String(f[1]).replace(/"/g,'&quot;')}" />
    </div>`).join('');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'editBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Edit ${item.type}</h3>
      <p>Correct anything Kin-nect read wrong — this updates what's saved to the family dashboard.</p>
      ${rows}
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-modal-save" onclick="saveEditModal()">Save changes</button>
      </div>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeEditModal(); });
  document.body.appendChild(backdrop);
}
function closeEditModal(){
  const b = document.getElementById('editBackdrop');
  if(b) b.remove();
}
function saveEditModal(){
  const item = verifyItems[verifyIdx];
  item.fields.forEach((f,i)=>{
    const input = document.getElementById(`edit-field-${i}`);
    if(input) f[1] = input.value;
  });
  if(item.med){
    const nameField = item.fields.find(f=>f[0]==='Medication');
    const doseField = item.fields.find(f=>f[0]==='Dose');
    const freqField = item.fields.find(f=>f[0]==='Frequency');
    if(nameField) item.med.name = nameField[1];
    if(doseField) item.med.dose = doseField[1];
    if(freqField) item.med.frequency = freqField[1];
  }
  closeEditModal();
  showToast('✎ Field updated');
  renderVerifyStep();
}

// ---------- SCREEN: dashboard ----------
const medStatusCycle = [
  {chipClass:"taken", chip:"Taken", sub:"Taken · 8:02 AM", checked:true},
  {chipClass:"due", chip:"Due 2pm", sub:"Due 2:00 PM", checked:false},
  {chipClass:"overdue", chip:"Overdue", sub:"Was due 9:00 AM", checked:false},
  {chipClass:"due", chip:"Due 6pm", sub:"Due 6:00 PM", checked:false}
];
const instrIcons = {
  "Wound Care":"🩹",
  "Red-Flag Symptom":"🚨",
  "Activity Restriction":"🚶",
  "Diet Instructions":"🥗"
};

function dashboardBodyHTML(){
  if(confirmedItems.length === 0){
    return `
      <div class="empty-state">
        <div class="emoji">📭</div>
        <h2 class="screen-title" style="margin-bottom:6px;">No scans confirmed yet</h2>
        <p class="screen-sub">Scan a medicine bottle or discharge paper and confirm it — the dashboard only fills in with what's actually been verified.</p>
        <button class="cta-btn static" onclick="goTo('upload')">Go to Scan →</button>
      </div>`;
  }

  const meds = confirmedItems.filter(i=>i.type==='Medication');
  const appts = confirmedItems.filter(i=>i.type==='Follow-up Appointment');
  const others = confirmedItems.filter(i=>i.type!=='Medication' && i.type!=='Follow-up Appointment');
  const tasksDone = meds.filter((m,i)=>medStatusCycle[i%medStatusCycle.length].checked).length;

  const medHTML = meds.length ? meds.map((m,i)=>{
    const st = medStatusCycle[i % medStatusCycle.length];
    return `
    <div class="med-item">
      <div class="checkbox ${st.checked?'checked':''}" onclick="toggleMed(this)">${st.checked?'✓':''}</div>
      <div class="med-info"><div class="med-name">${m.med.name} ${m.med.dose}</div><div class="med-sub">${st.sub} · ${m.med.frequency}</div></div>
      <div class="status-chip ${st.chipClass}">${st.chip}</div>
    </div>`;
  }).join('') : `<p class="screen-sub" style="margin:0 0 12px;">No medicine bottles scanned yet.</p>`;

  const apptHTML = appts.length ? appts.map(a=>{
    const get = k => (a.fields.find(f=>f[0]===k)||[])[1] || '';
    const dateStr = get('Date') || '';
    const dayNum = (dateStr.match(/\d+/)||[''])[0];
    const monthStr = dateStr.replace(/[A-Za-z]+,\s*/,'').replace(/\d+/,'').trim().slice(0,3) || 'TBD';
    return `
    <div class="appt-card">
      <div class="appt-date"><div class="d">${dayNum||'—'}</div><div class="m">${monthStr}</div></div>
      <div class="appt-info"><div class="who">${get('Provider')}</div><div class="what">${get('Time')} · bring ${(get('Bring')||'').toLowerCase()}</div></div>
    </div>`;
  }).join('') : '';

  const othersHTML = others.length ? others.map(o=>{
    const icon = instrIcons[o.type] || '📋';
    return `
    <div class="instr-card">
      <div class="instr-head"><span class="icon">${icon}</span>${o.type}</div>
      ${o.fields.map(f=>`<div class="instr-row"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('')}
    </div>`;
  }).join('') : '';

  const firstAppt = appts[0];
  const alertText = firstAppt
    ? `📩 Text sent to family group: "Follow-up with ${(firstAppt.fields.find(f=>f[0]==='Provider')||[])[1]} is coming up — details are in Kin-nect."`
    : `📩 Kin-nect will text the family group automatically once an appointment is confirmed.`;

  return `
    <h2 class="screen-title">Mom's Recovery Plan</h2>
    <div class="fam-row">
      <div class="avatar" style="background:#2a78d6;">C</div>
      <div class="avatar" style="background:#1baf7a;">S</div>
      <div class="avatar" style="background:#4a3aa7;">M</div>
      <span class="fam-label">Christos, Sarah &amp; Mom · shared plan</span>
    </div>

    <div class="stat-row">
      <div class="stat-tile"><div class="num">${tasksDone}/${meds.length}</div><div class="lbl">Meds taken today</div></div>
      <div class="stat-tile"><div class="num">${confirmedItems.length}</div><div class="lbl">Items from your scans</div></div>
    </div>

    <div class="section-h">Medication checklist</div>
    ${medHTML}

    ${appts.length ? `<div class="section-h">Upcoming appointments</div>${apptHTML}` : ''}

    ${others.length ? `<div class="section-h">Care instructions</div>${othersHTML}` : ''}

    <div class="alert-box">${alertText}</div>
    <div style="height:20px"></div>
  `;
}
function toggleMed(el){
  el.classList.toggle('checked');
  el.innerHTML = el.classList.contains('checked') ? '✓' : '';
}

// ---------- app shell renderer ----------
function bottomNavHTML(active){
  return `
    <div class="bottomnav">
      ${NAV_TABS.map(t => `
        <button class="navitem ${active===t.key?'active':''}" onclick="goTo('${t.key}')">
          <svg viewBox="0 0 24 24" fill="${active===t.key?'var(--blue)':'none'}" stroke="${active===t.key?'var(--blue)':'var(--ink-muted)'}">${NAV_ICONS[t.key]}</svg>
          ${t.label}
        </button>
      `).join('')}
    </div>`;
}

function renderScreen(name){
  const showNav = ['upload','dashboard','family','settings'].includes(name);
  const activeNavKey = name === 'parse' || name === 'verify' ? 'upload' : name;

  let bodyHTML = '';
  let footerHTML = '';

  if(name === 'upload'){
    bodyHTML = `
      <h2 class="screen-title">New discharge packet</h2>
      <p class="screen-sub">Scan medicine bottles and discharge papers — Kin-nect reads both and builds the dashboard, no portal login needed.</p>
      <div class="upload-actions">
        <button class="btn-secondary-fill" onclick="addPage('bottle')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="8" y="3" width="8" height="18" rx="2.5" stroke="#184f95" stroke-width="1.7"/><path d="M8 8h8" stroke="#184f95" stroke-width="1.7"/><rect x="9.5" y="1.5" width="5" height="3" rx="1" fill="#184f95"/></svg>
          Scan Medicine Bottle
        </button>
        <button class="btn-primary-fill" onclick="addPage('discharge')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l3 3v15a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="#fff" stroke-width="1.6"/><path d="M9 11h6M9 15h6M9 7h3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
          Scan Discharge Papers
        </button>
      </div>
      <p class="upload-hint">💊 Bottle labels give Kin-nect the medication, dose, and refill info. 📄 Discharge papers give appointments, wound care, and warning signs. Tap ✕ on a thumbnail to remove it.</p>
      <div class="thumb-grid" id="thumbGrid"></div>
    `;
    footerHTML = `<div class="cta-bar"><button class="cta-btn" id="processBtn" onclick="startProcessing();">Scan a document to begin</button></div>`;
  } else if(name === 'parse'){
    bodyHTML = `
      <div class="parse-wrap">
        <div class="ring" id="ring" style="--pct:0"><div class="ring-inner" id="ringPct">0%</div></div>
        <div class="steplist" id="stepList"></div>
      </div>
    `;
    footerHTML = `<div class="cta-bar"><button class="cta-btn ghost" id="parseContinue" style="display:none;" onclick="goTo('verify'); verifyIdx=0; renderVerifyStep();">Continue to Verification →</button></div>`;
  } else if(name === 'verify'){
    bodyHTML = `
      <h2 class="screen-title">Confirm each item</h2>
      <p class="screen-sub">Nothing reaches the family dashboard until you confirm it's correct.</p>
      <div class="verify-progress"><span id="vp-label"></span><span id="vp-count"></span></div>
      <div class="bar-track"><div class="bar-fill" id="vp-bar"></div></div>
      <div class="doc-card"><span class="label">Original document — page snippet</span><span id="vp-snippet"></span></div>
      <div class="extract-card">
        <div class="label"><span>Kin-nect extracted</span><span class="confbadge" id="vp-conf"></span></div>
        <div id="vp-fields"></div>
      </div>
      <div class="verify-actions">
        <button class="btn-confirm" onclick="confirmVerify()">✓ Looks right</button>
        <button class="btn-edit" onclick="openEditModal()">✎ Edit</button>
      </div>
    `;
  } else if(name === 'dashboard'){
    bodyHTML = dashboardBodyHTML();
  } else if(name === 'family'){
    bodyHTML = familyBodyHTML();
  } else if(name === 'settings'){
    bodyHTML = settingsBodyHTML();
  }

  const appEl = document.getElementById('app');
  appEl.innerHTML = `

    ${showNav ? bottomNavHTML(activeNavKey) : ''}

  if(name==='upload'){ renderThumbGrid(); }
  if(name==='verify'){ renderVerifyStep(); }
}

// init
renderScreen('upload');
