<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#fcfcfb" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Kin·Nect</title>
<style>
  :root{
    --surface-1:#ffffff;
    --surface-2:#f7f7f6;
    --page-plane:#f0f1ee;
    --ink-1:#14151a;
    --ink-2:#44454c;
    --ink-muted:#767781;
    --gridline:#eceae4;
    --border:rgba(20,21,26,0.08);

    --blue:#3d7fe6;
    --blue-deep:#2559ad;
    --blue-soft:#eef3fd;
    --aqua:#16b892;
    --aqua-deep:#0c8e70;
    --violet:#7c5cf0;

    --good:#1aa25e;
    --warning:#d3860a;
    --critical:#e3453f;

    --good-bg:#e4f7ec;
    --warning-bg:#fdf1dc;
    --critical-bg:#fdeaea;

    --shadow-xs: 0 1px 2px rgba(20,21,26,0.05);
    --shadow-sm: 0 2px 8px rgba(20,21,26,0.06), 0 1px 2px rgba(20,21,26,0.04);
    --shadow-md: 0 8px 24px rgba(20,21,26,0.08), 0 2px 6px rgba(20,21,26,0.04);
    --shadow-lg: 0 16px 40px rgba(20,21,26,0.14), 0 4px 10px rgba(20,21,26,0.06);

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"]{
    --surface-1:#1a1b1f;
    --surface-2:#222327;
    --page-plane:#0d0e10;
    --ink-1:#f5f5f4;
    --ink-2:#d3d3d6;
    --ink-muted:#98989f;
    --gridline:#2d2e33;
    --border:rgba(255,255,255,0.10);
    --blue-soft:#1c2a45;
    --good-bg:#123421;
    --warning-bg:#392c11;
    --critical-bg:#3a1a1a;
    --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-sm: 0 2px 10px rgba(0,0,0,0.4);
    --shadow-md: 0 10px 28px rgba(0,0,0,0.5);
    --shadow-lg: 0 20px 48px rgba(0,0,0,0.55);
  }
  :root[data-theme="dark"] .edit-row input,
  :root[data-theme="dark"] .age-option{
    background:var(--surface-2);
    color:var(--ink-1);
  }
  :root[data-theme="dark"] .doc-card{
    background:#26210f;
    color:#e7d9ad;
  }
  :root[data-theme="dark"] .doc-card .label{ color:#c9ac68; }
  :root[data-theme="dark"] .doc-card mark{ background:#5c4a17; color:#ffe8a3; }
  :root[data-theme="dark"] .thumb:not(.has-photo){ background:var(--surface-2); }
  :root[data-theme="dark"] .thumb.bottle:not(.has-photo){ background:#182238; }
  :root[data-theme="dark"] .thumb.discharge:not(.has-photo){ background:#1f2a20; }
  :root[data-theme="dark"] .thumb.otc:not(.has-photo){ background:#332215; }
  :root[data-theme="dark"] .appt-date{ background:var(--blue-soft); }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{ height:100%; }
  body{
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-plane);
    color: var(--ink-1);
    height:100%;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    line-height:1.4;
  }

  #app{
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    display:flex;
    flex-direction:column;
    background:var(--surface-1);
    max-width:560px;
    margin:0 auto;
    box-shadow:0 0 60px rgba(0,0,0,0.08);
  }

  .app-header{
    flex:0 0 auto;
    padding: calc(var(--safe-top) + 14px) 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:color-mix(in srgb, var(--surface-1) 88%, transparent);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 1px 0 var(--border);
    position:relative;
    z-index:2;
  }
  .brand{
    display:flex; align-items:center; gap:9px;
    font-weight:800; font-size:18px; color:var(--ink-1);
    letter-spacing:-0.01em;
  }
  .brand svg{ width:24px; height:24px; }
  .header-right{
    display:flex; align-items:center; gap:10px;
  }
  .avatar-mini{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; color:#fff;
    background:linear-gradient(145deg, var(--blue), var(--blue-deep));
    box-shadow: var(--shadow-xs);
  }
  .theme-header-btn{
    width:34px; height:34px; border-radius:50%;
    border:none; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; flex:0 0 auto;
    box-shadow: var(--shadow-xs);
    transition: transform .12s ease;
  }
  .theme-header-btn:active{ transform:scale(0.9); }
  .theme-header-btn svg{ width:17px; height:17px; }

  .app-body{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 20px 24px;
    -webkit-user-select:text;
    user-select:text;
    background:var(--page-plane);
  }
  .app-body::-webkit-scrollbar{ width:0; }

  .bottomnav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-around;
    background:color-mix(in srgb, var(--surface-1) 90%, transparent);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    box-shadow: 0 -1px 0 var(--border);
    padding: 9px 4px calc(var(--safe-bottom) + 9px);
    position:relative;
    z-index:2;
  }
  .bottomnav .navitem{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:11.5px; color:var(--ink-muted); font-weight:600;
    background:none; border:none; cursor:pointer;
    padding:6px 10px; border-radius:12px;
    flex:1;
    transition: color .15s ease, transform .12s ease;
  }
  .bottomnav .navitem:active{ transform:scale(0.92); }
  .bottomnav .navitem.active{ color:var(--blue); }
  .bottomnav .navitem svg{ width:22px; height:22px; }

  h2.screen-title{
    font-size:22px;
    font-weight:800;
    margin:18px 0 5px;
    letter-spacing:-0.02em;
  }
  p.screen-sub{
    margin:0 0 20px;
    color:var(--ink-2);
    font-size:14.5px;
    line-height:1.5;
  }

  /* ---- Upload screen ---- */
  .upload-actions{ display:flex; gap:10px; margin-bottom:20px; }
  .scan-card{
    flex:1; min-width:0;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    background:var(--surface-1);
    border:none;
    border-radius:20px;
    padding:18px 6px 15px;
    cursor:pointer;
    text-align:center;
    font-family:inherit;
    transition: transform .15s cubic-bezier(.2,.8,.2,1), box-shadow .15s ease;
    box-shadow: var(--shadow-sm);
  }
  .scan-card:active{ transform:scale(0.95) translateY(1px); box-shadow: var(--shadow-xs); }
  .scan-card .icon-badge{
    width:46px; height:46px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .scan-card.bottle .icon-badge{ background:linear-gradient(150deg,#eaf1fb,#dbe9fb); }
  .scan-card.discharge .icon-badge{ background:linear-gradient(150deg,#e3f5ec,#d3f0e3); }
  .scan-card.otc .icon-badge{ background:linear-gradient(150deg,#fdece0,#fbe0cb); }
  :root[data-theme="dark"] .scan-card.bottle .icon-badge{ background:linear-gradient(150deg,#182238,#1c2c48); }
  :root[data-theme="dark"] .scan-card.discharge .icon-badge{ background:linear-gradient(150deg,#152a1f,#183a28); }
  :root[data-theme="dark"] .scan-card.otc .icon-badge{ background:linear-gradient(150deg,#332215,#402a18); }
  .scan-card .scan-label{ font-size:13px; font-weight:800; color:var(--ink-1); line-height:1.25; }
  .scan-card .scan-sub{ font-size:11.5px; color:var(--ink-muted); font-weight:600; letter-spacing:.01em; }

  .thumb-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .thumb{
    aspect-ratio:3/4;
    border-radius:16px;
    background:var(--surface-2);
    border:none;
    box-shadow: var(--shadow-xs);
    display:flex;
    align-items:flex-end;
    padding:7px;
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-muted);
    position:relative;
  }
  .thumb.add{
    align-items:center;
    justify-content:center;
    color:var(--blue);
    font-size:26px;
    font-weight:300;
    box-shadow:none;
    background:var(--surface-2);
    border:1.5px dashed var(--gridline);
    cursor:pointer;
  }
  .thumb .pagebadge{
    position:absolute; top:7px; right:7px;
    background:rgba(255,255,255,0.9);
    border-radius:8px;
    padding:2px 6px;
    font-size:11px;
    box-shadow: var(--shadow-xs);
  }
  .thumb.bottle{ background:linear-gradient(155deg,#eaf1fb,#dbe9fb); }
  .thumb.discharge{ background:linear-gradient(155deg,#f4efe3,#ece2c9); }
  .thumb.otc{ background:linear-gradient(155deg,#fdece0,#fbe0cb); }
  .thumb.has-photo{
    background-size:cover;
    background-position:center;
  }
  .thumb.has-photo .typelabel{
    background:rgba(0,0,0,0.6);
    color:#fff;
    padding:3px 6px;
    border-radius:7px;
    align-self:flex-start;
  }
  .thumb .typeicon{
    position:absolute; top:7px; left:7px;
    font-size:14px;
    background:rgba(255,255,255,0.9);
    border-radius:8px;
    padding:2px 6px;
    box-shadow: var(--shadow-xs);
  }
  .thumb .typelabel{
    font-size:11px;
    font-weight:700;
    color:var(--ink-2);
  }
  .thumb .removeb{
    position:absolute; bottom:7px; right:7px;
    background:rgba(255,255,255,0.95);
    border-radius:8px;
    padding:1px 6px;
    font-size:12px;
    color:var(--critical);
    cursor:pointer;
    box-shadow: var(--shadow-xs);
  }
  .upload-hint{
    font-size:12.5px;
    color:var(--ink-muted);
    margin:-10px 0 18px;
    line-height:1.45;
  }

  .cta-bar{
    flex:0 0 auto;
    padding:12px 20px calc(var(--safe-bottom) + 12px);
    background:color-mix(in srgb, var(--surface-1) 90%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 -1px 0 var(--border);
  }
  .cta-btn{
    width:100%;
    background:linear-gradient(135deg, var(--blue), var(--blue-deep));
    color:#fff;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(61,127,230,0.35);
    transition: transform .12s ease, box-shadow .12s ease;
    letter-spacing:-0.01em;
  }
  .cta-btn:active{ transform:scale(0.98); }
  .cta-btn:disabled{ opacity:.45; cursor:default; box-shadow:none; }
  .cta-btn.ghost{
    background:var(--surface-2);
    color:var(--blue);
    box-shadow:none;
    border:none;
  }
  .cta-btn.static{ position:static; width:100%; }

  /* ---- Parsing screen ---- */
  .parse-wrap{
    display:flex; flex-direction:column; align-items:center;
    padding-top:34px;
  }
  .ring{
    width:128px; height:128px;
    border-radius:50%;
    background:conic-gradient(var(--blue) calc(var(--pct,0)*1%), var(--gridline) 0);
    display:flex; align-items:center; justify-content:center;
    margin-bottom:24px;
    transition:background 0.3s;
    box-shadow: var(--shadow-sm);
  }
  .ring-inner{
    width:102px; height:102px;
    border-radius:50%;
    background:var(--surface-1);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:21px;
  }
  .steplist{ width:100%; }
  .step{
    display:flex; align-items:center; gap:11px;
    padding:11px 0;
    font-size:14px;
    color:var(--ink-muted);
    font-weight:600;
  }
  .step .dot{
    width:22px; height:22px; border-radius:50%;
    border:2px solid var(--gridline);
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, border-color .2s ease;
  }
  .step.done{ color:var(--ink-1); }
  .step.done .dot{ background:var(--good); border-color:var(--good); }
  .step.active .dot{ border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-soft); }
  .step.done .dot::after{ content:"✓"; color:#fff; font-size:12px; font-weight:900; }

  /* ---- Verification screen ---- */
  .verify-progress{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:10px;
    font-size:13px; font-weight:700; color:var(--ink-muted);
  }
  .bar-track{
    height:6px; background:var(--gridline); border-radius:4px;
    overflow:hidden; margin-bottom:18px;
  }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--blue), var(--aqua)); border-radius:4px; transition:width .3s; }

  .doc-card{
    background:#f6f0e2;
    border:none;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size:13px;
    line-height:1.6;
    color:#4a4633;
    box-shadow: var(--shadow-sm);
  }
  .doc-card .label{
    font-family:system-ui,sans-serif;
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:#8a7f5c; font-weight:700; margin-bottom:7px; display:block;
  }
  .doc-card mark{
    background:#ffe8a3;
    padding:0 3px;
    border-radius:4px;
  }

  .extract-card{
    background:var(--surface-1);
    border:none;
    border-radius:16px;
    padding:16px;
    margin-bottom:14px;
    box-shadow: var(--shadow-sm);
  }
  .extract-card .label{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); font-weight:700; margin-bottom:9px; display:flex;
    align-items:center; justify-content:space-between;
  }
  .confbadge{
    font-size:11.5px; font-weight:700; border-radius:999px; padding:3px 9px;
    text-transform:none; letter-spacing:0;
  }
  .confbadge.high{ background:var(--good-bg); color:var(--good); }
  .confbadge.low{ background:var(--warning-bg); color:var(--warning); }

  .field-row{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:8px 0;
    border-bottom:1px solid var(--gridline);
    font-size:14px;
    gap:12px;
  }
  .field-row:last-child{ border-bottom:none; }
  .field-row .k{ color:var(--ink-muted); font-weight:600; }
  .field-row .v{ font-weight:700; text-align:right; }

  .verify-actions{ display:flex; gap:10px; margin-bottom:8px; }
  .btn-confirm{
    flex:1.4; background:linear-gradient(135deg, var(--good), var(--aqua-deep)); color:#fff; border:none;
    border-radius:14px; padding:15px; font-weight:700; font-size:14px; cursor:pointer;
    box-shadow: 0 6px 16px rgba(26,162,94,0.3);
    transition: transform .12s ease;
  }
  .btn-confirm:active{ transform:scale(0.98); }
  .btn-confirm:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  .btn-edit{
    flex:1; background:var(--warning-bg); color:var(--warning); border:none;
    border-radius:14px; padding:15px; font-weight:700; font-size:14px; cursor:pointer;
  }

  /* ---- Age-range verification (OTC medicines with more than one dosing group) ---- */
  .age-hint{ font-size:13px; color:var(--ink-muted); margin:0 0 10px; line-height:1.4; }
  .age-options{ display:flex; flex-direction:column; gap:8px; }
  .age-option{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    width:100%; text-align:left;
    border:none; background:var(--surface-2);
    border-radius:14px; padding:12px 14px;
    font-size:13.5px; font-weight:600; color:var(--ink-1);
    cursor:pointer;
    transition: background .12s ease, box-shadow .12s ease;
  }
  .age-option .age-dose{ font-weight:800; color:var(--blue-deep); white-space:nowrap; }
  .age-option.selected{ background:var(--blue-soft); box-shadow: inset 0 0 0 1.5px var(--blue); }
  :root[data-theme="dark"] .age-option.selected .age-dose{ color:#9dc4f9; }

  /* ---- Edit modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,10,14,0.55);
    backdrop-filter: blur(2px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .modal-sheet{
    background:var(--surface-1);
    width:100%; max-width:560px;
    border-radius:24px 24px 0 0;
    padding:20px 20px calc(var(--safe-bottom) + 20px);
    max-height:80vh;
    overflow-y:auto;
    box-shadow: var(--shadow-lg);
  }
  .modal-sheet h3{ margin:0 0 5px; font-size:18px; font-weight:800; letter-spacing:-0.01em; }
  .modal-sheet p{ margin:0 0 16px; font-size:13px; color:var(--ink-muted); }
  .edit-row{ margin-bottom:12px; }
  .edit-row label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em; }
  .edit-row input{
    width:100%; border:none; border-radius:12px;
    padding:12px 14px; font-size:14px; font-family:inherit; color:var(--ink-1);
    background:var(--surface-2);
  }
  .edit-row input:focus{ outline:none; box-shadow: inset 0 0 0 1.5px var(--blue); }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{
    flex:1; border:none; border-radius:14px; padding:14px; font-weight:700; font-size:14px; cursor:pointer;
    transition: transform .12s ease;
  }
  .modal-actions button:active{ transform:scale(0.97); }
  .btn-modal-cancel{ background:var(--surface-2); color:var(--ink-2); }
  .btn-modal-save{ background:linear-gradient(135deg, var(--blue), var(--blue-deep)); color:#fff; box-shadow:0 6px 16px rgba(61,127,230,0.3); }

  /* ---- Take Photo / Choose from Files chooser ---- */
  .source-choices{ display:flex; flex-direction:column; gap:10px; }
  .source-choices button{
    width:100%; border:none; border-radius:14px; padding:15px; font-weight:700; font-size:14.5px; cursor:pointer;
    transition: transform .12s ease;
  }
  .source-choices button:active{ transform:scale(0.97); }
  .btn-modal-text{ background:transparent; color:var(--ink-muted); font-weight:600; }

  /* ---- Capture review (after camera returns a photo) ---- */
  .capture-preview{
    width:100%;
    max-height:52vh;
    border-radius:16px;
    object-fit:cover;
    margin-bottom:14px;
    background:#111;
    display:block;
    box-shadow: var(--shadow-sm);
  }
  .capture-typepill{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2); color:var(--ink-2);
    font-size:12.5px; font-weight:700;
    border-radius:999px; padding:6px 13px;
    margin-bottom:12px;
  }

  /* ---- Dashboard screen ---- */
  .fam-row{ display:flex; align-items:center; gap:8px; margin-bottom:18px; }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:#fff;
    border:2.5px solid var(--surface-1);
    margin-left:-11px;
    box-shadow: var(--shadow-xs);
  }
  .fam-row .avatar:first-child{ margin-left:0; }
  .fam-label{ font-size:13px; color:var(--ink-muted); font-weight:600; margin-left:6px; }

  .stat-row{ display:flex; gap:10px; margin-bottom:22px; }
  .stat-tile{
    flex:1; background:var(--surface-1); border:none;
    border-radius:16px; padding:14px;
    box-shadow: var(--shadow-sm);
  }
  .stat-tile .num{ font-size:25px; font-weight:800; line-height:1; letter-spacing:-0.02em; }
  .stat-tile .lbl{ font-size:12px; color:var(--ink-muted); font-weight:600; margin-top:5px; }

  .section-h{
    font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink-muted); margin:20px 0 10px;
  }

  .med-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-1); border:none;
    border-radius:16px; padding:13px 14px; margin-bottom:9px;
    box-shadow: var(--shadow-xs);
  }
  .checkbox{
    width:24px; height:24px; border-radius:50%;

<body>

  <div id="app"></div>
  <div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script>
// ============================================================
// Kin-Nect — real single-page app shell (mobile-first).
// Same demo logic as the earlier clickable prototype, now
// running full-screen the way it would on an actual phone,
// with real navigation (no phone-frame mockup, no tab strip).
// ============================================================

// Bump this string on every build. Visible in Settings so we can confirm
// whether a device is actually loading the latest deployed code, or a
// stale cached copy (very common right after a GitHub Pages update).
window.KINNECT_BUILD = "2026-08-12-r4-ocr-preprocess";

const NAV_ICONS = {
  dashboard: '<circle cx="7" cy="12" r="4"/><circle cx="17" cy="12" r="4"/><path d="M10.5 12h3" stroke-width="1.8" stroke-linecap="round" fill="none"/>',
  upload: '<path d="M12 4v11M12 4l-4 4M12 4l4 4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15v3a2 2 0 002 2h10a2 2 0 002-2v-3" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  family: '<circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M15.5 14.2c2.2.4 3.9 2.1 3.9 4.8" stroke-width="1.8" fill="none" stroke-linecap="round"/>',
  settings: '<circle cx="12" cy="12" r="3" stroke-width="1.8" fill="none"/><path d="M12 4v2.2M12 17.8V20M4 12h2.2M17.8 12H20M6.3 6.3l1.5 1.5M16.2 16.2l1.5 1.5M6.3 17.7l1.5-1.5M16.2 7.8l1.5-1.5" stroke-width="1.6" stroke-linecap="round"/>'
};

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

// ---------- shared nav ----------
let currentScreen = 'upload';
const NAV_TABS = [
  {key:'dashboard', label:'Home'},
  {key:'upload', label:'Scan'},
  {key:'family', label:'Family'},
  {key:'settings', label:'Settings'}
];

function goTo(name){
  currentScreen = name;
  renderScreen(name);
}

// ---------- SCREEN: upload data ----------
// Each scanned page is tracked with its source type so the AI step,
// verification queue, and dashboard all reflect what was actually scanned.
let documents = [];
let pageCount = documents.length;

function renderThumbGrid(){
  const grid = document.getElementById('thumbGrid');
  if(!grid) return;
  let html = '';
  documents.forEach((doc,i)=>{
    const icon = doc.type === 'bottle' ? '💊' : (doc.type === 'otc' ? '📦' : '📄');
    const label = doc.type === 'bottle' ? 'Bottle' : (doc.type === 'otc' ? 'OTC Med' : 'Discharge');
    const photoSrc = doc.image || doc.frontImage;
    const hasPhoto = !!photoSrc;
    const style = hasPhoto ? ` style="background-image:url('${photoSrc}')"` : '';
    html += `<div class="thumb ${doc.type} ${hasPhoto?'has-photo':''}"${style}>
      ${hasPhoto ? '' : `<span class="typeicon">${icon}</span>`}
      <span class="pagebadge">p.${i+1}</span>
      <span class="typelabel">${label}</span>
      <span class="removeb" onclick="removePage(${i}, event)">✕</span>
    </div>`;
  });
  html += `<div class="thumb add" onclick="triggerScan('discharge')">+</div>`;
  grid.innerHTML = html;
  pageCount = documents.length;
  refreshCta();
}
function refreshCta(){
  const btn = document.getElementById('processBtn');
  if(btn){
    btn.disabled = pageCount === 0;
    btn.textContent = pageCount === 0 ? 'Scan a document to begin' : `Process ${pageCount} page${pageCount>1?'s':''} with AI →`;
  }
}

// ---- Camera capture flow: open camera -> review photo(s) -> accept/retake ----
// OTC medicine boxes need two shots (front label, then the directions/dosing
// panel), so pendingCapture tracks a "stage" for that type only.
let pendingCapture = null; // { type, image } or { type:'otc', stage, frontImage, directionsImage }

// Some mobile browsers (notably iOS Safari) don't reliably re-fire the
// "change" event on a file input that's already been used once for a
// camera capture — which is why a second shot could silently fail to come
// through. Creating a brand-new <input> for every single shot, instead of
// reusing one persistent element, avoids that entirely.
//
// Two extra defenses added here for real mobile hardware (a headless
// desktop browser won't surface either of these):
//  1. display:none can be unreliable for a *dynamically created* file
//     input on some iOS/Android versions — it's swapped for an
//     off-screen-but-rendered style instead.
//  2. input.click() is deferred one frame after the element is attached,
//     since firing it in the same tick it's created has been flaky on
//     some WebKit versions.
function openFileInput(type, useCamera){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if(useCamera) input.capture = 'environment';
  input.setAttribute('aria-hidden', 'true');
  input.style.position = 'fixed';
  input.style.top = '-9999px';
  input.style.left = '-9999px';
  input.style.width = '1px';
  input.style.height = '1px';
  input.style.opacity = '0';
  document.body.appendChild(input);

  let handled = false;
  const cleanup = ()=>{ if(input.parentNode) input.parentNode.removeChild(input); };
  const onChange = (e)=>{
    if(handled) return; // guard against a stray double-fire
    handled = true;
    input.removeEventListener('change', onChange);
    handleCameraFile(type, e.target.files);
    setTimeout(cleanup, 1000); // give the browser a moment to finish reading the file first
  };
  input.addEventListener('change', onChange);

  requestAnimationFrame(()=> input.click());
}

function sourceLabelFor(type){
  if(type === 'bottle') return 'medicine bottle label';
  if(type === 'discharge') return 'discharge paperwork';
  if(pendingCapture && pendingCapture.stage === 'directions') return 'directions panel';
  return 'front label';
}
function showSourceChooser(type){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'sourceChooserBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Add a photo</h3>
      <p>Scan the ${sourceLabelFor(type)} with your camera, or choose a photo you already have.</p>
      <div class="source-choices">
        <button class="btn-modal-save" onclick="closeSourceChooser(); openFileInput('${type}', true)">📷 Take Photo</button>
        <button class="btn-modal-cancel" onclick="closeSourceChooser(); openFileInput('${type}', false)">🖼 Choose from Files</button>
        <button class="btn-modal-text" onclick="closeSourceChooser(); cancelPendingCapture()">Cancel</button>
      </div>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop){ closeSourceChooser(); cancelPendingCapture(); } });
  document.body.appendChild(backdrop);
}
function closeSourceChooser(){
  const b = document.getElementById('sourceChooserBackdrop');
  if(b) b.remove();
}
function cancelPendingCapture(){
  pendingCapture = null;
}
function triggerScan(type){
  type = type || 'discharge';
  pendingCapture = type === 'otc' ? { type:'otc', stage:'front' } : { type };
  showSourceChooser(type);
}

function handleCameraFile(type, fileList){
  const file = fileList && fileList[0];
  if(!file) return; // user backed out of the camera without taking a photo
  const reader = new FileReader();
  reader.onload = (e)=>{
    const dataUrl = e.target.result;
    if(type === 'otc'){
      if(!pendingCapture || pendingCapture.type !== 'otc'){
        pendingCapture = { type:'otc', stage:'front' };
      }
      if(pendingCapture.stage === 'front'){
        pendingCapture.frontImage = dataUrl;
        pendingCapture.stage = 'directions';
        showOtcBridge();
      } else {
        pendingCapture.directionsImage = dataUrl;
        openCaptureReview();
      }
    } else {
      pendingCapture = { type, image: dataUrl };
      openCaptureReview();
    }
  };
  reader.readAsDataURL(file);
}

// Mobile browsers only let a file input re-open the camera from inside a
// real tap — not from a callback that fires after the camera already
// closed (like FileReader.onload). So between the two OTC shots we show an
// explicit interstitial the person taps, instead of trying to silently
// reopen the camera on their behalf (which is what was causing the freeze).
function showOtcBridge(){
  if(!pendingCapture) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'otcBridgeBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Front label captured ✓</h3>
      <img class="capture-preview" style="max-height:32vh;" src="${pendingCapture.frontImage}" alt="Front label" />
      <p>Now scan the <strong>Directions panel</strong> — the part of the box with the dosing chart.</p>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="cancelOtcCapture()">Cancel</button>
        <button class="btn-modal-save" onclick="continueOtcCapture()">Add Directions Panel →</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
}
function closeOtcBridge(){
  const b = document.getElementById('otcBridgeBackdrop');
  if(b) b.remove();
}
function continueOtcCapture(){
  closeOtcBridge();
  showSourceChooser('otc'); // real tap just happened, so camera/file picker opens reliably
}
function cancelOtcCapture(){
  closeOtcBridge();
  pendingCapture = null;
}

function openCaptureReview(){
  if(!pendingCapture) return;
  const isOtc = pendingCapture.type === 'otc';
  const label = pendingCapture.type === 'bottle' ? '💊 Medicine bottle' : (isOtc ? '📦 OTC medicine box' : '📄 Discharge paperwork');
  const imagesHTML = isOtc
    ? `<p style="margin:0 0 6px;font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;">Front label</p>
       <img class="capture-preview" style="max-height:24vh;margin-bottom:12px;" src="${pendingCapture.frontImage}" alt="Front label" />
       <p style="margin:0 0 6px;font-size:12px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.04em;">Directions panel</p>
       <img class="capture-preview" style="max-height:24vh;" src="${pendingCapture.directionsImage}" alt="Directions panel" />`
    : `<img class="capture-preview" src="${pendingCapture.image}" alt="Captured document" />`;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'captureBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Use ${isOtc ? 'these photos' : 'this photo'}?</h3>
      <div class="capture-typepill">${label}</div>
      ${imagesHTML}
      <p>Make sure the text is in focus and fully visible before accepting.</p>
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="retakePhoto()">↺ Retake</button>
        <button class="btn-modal-save" onclick="acceptPhoto()">✓ Use Photo${isOtc?'s':''}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
}
function closeCaptureReview(){
  const b = document.getElementById('captureBackdrop');
  if(b) b.remove();
}
function retakePhoto(){
  const type = pendingCapture ? pendingCapture.type : 'discharge';
  closeCaptureReview();
  triggerScan(type);
}
function acceptPhoto(){
  if(!pendingCapture) return;
  if(pendingCapture.type === 'otc'){
    if(!pendingCapture.frontImage || !pendingCapture.directionsImage) return;
    documents.push({ type:'otc', frontImage: pendingCapture.frontImage, directionsImage: pendingCapture.directionsImage });
    showToast('✓ OTC medicine box added');
  } else {
    if(!pendingCapture.image) return;
    documents.push({ type: pendingCapture.type, image: pendingCapture.image });
    showToast(pendingCapture.type === 'bottle' ? '✓ Bottle label added' : '✓ Discharge page added');
  }
  pageCount = documents.length;
  pendingCapture = null;
  closeCaptureReview();
  renderThumbGrid();
}

function removePage(i, ev){
  if(ev) ev.stopPropagation();
  documents.splice(i,1);
  pageCount = documents.length;
  renderThumbGrid();
}
function startProcessing(){
  if(pageCount === 0) return;
  confirmedItems = [];
  verifyIdx = 0;
  goTo('parse');
  runExtraction(); // real Claude Vision calls if a key is set, demo data otherwise
}

// ---------- SCREEN: parsing ----------
function getParseSteps(docs){
  const steps = ["Reading layout & tables"];
  if(docs.some(d=>d.type==='bottle')) steps.push("Reading prescription labels");
  if(docs.some(d=>d.type==='otc')) steps.push("Matching OTC dosing charts to age range");
  if(docs.some(d=>d.type==='discharge')) steps.push("Extracting discharge instructions");
  steps.push("Cross-checking with the family dashboard");
  steps.push("Flagging anything unclear");
  return steps;
}
let parseSteps = [];
function renderStepList(activeIdx, doneCount){
  const el = document.getElementById('stepList');
  if(!el) return;
  el.innerHTML = parseSteps.map((s,i)=>{
    const cls = i < doneCount ? 'done' : (i===activeIdx ? 'active' : '');
    return `<div class="step ${cls}"><div class="dot"></div>${s}</div>`;
  }).join('');
}

// Runs one extraction per scanned document, in order, and drives the ring +
// step list off REAL progress (each document finishing its OCR pass) rather
// than a fake timer. Falls back to placeholder demo data per-document if
// on-device OCR is turned off, unavailable, or that specific pass fails —
// one bad photo never blocks the rest of the batch.
async function runExtraction(){
  parseSteps = getParseSteps(documents);
  renderStepList(0,0);
  const ring = document.getElementById('ring');
  const ringPct = document.getElementById('ringPct');
  const continueBtn = document.getElementById('parseContinue');
  if(continueBtn) continueBtn.style.display = 'none';

  const ocrOn = isOcrEnabled() && typeof Tesseract !== 'undefined';
  resetDemoCounters();
  verifyItems = [];

  const total = documents.length;
  for(let i=0; i<total; i++){
    const doc = documents[i];
    let item = null;
    if(ocrOn){
      try{
        item = await extractWithOcr(doc);
      }catch(err){
        console.error('Kin-Nect OCR error:', err);
        showToast('⚠️ On-device text scan failed for one item — used placeholder instead');
      }
    }
    if(!item) item = demoItemFor(doc);
    verifyItems.push(item);

    const doneSteps = Math.min(parseSteps.length, Math.max(1, Math.round(((i+1)/total)*parseSteps.length)));
    renderStepList(doneSteps, doneSteps);
    const pct = Math.round(((i+1)/total)*100);
    if(ring) ring.style.setProperty('--pct', pct);
    if(ringPct) ringPct.textContent = pct+'%';
  }

  renderStepList(parseSteps.length, parseSteps.length);
  if(continueBtn) continueBtn.style.display = 'block';
}

// ---------- Free, on-device OCR (Tesseract.js) ----------
// No account, no API key, no per-scan cost, nothing leaves the browser.
// Trade-off: it recognizes raw text, but it cannot intelligently structure
// a dosing chart the way a paid vision model could — so results here are
// the raw scanned text for a person to read, not clean auto-filled fields.
function isOcrEnabled(){
  try{
    const v = localStorage.getItem('kinnect-ocr-enabled');
    return v === null ? true : v === '1'; // on by default since it's free
  }catch(e){ return true; }
}
function setOcrEnabled(on){ try{ localStorage.setItem('kinnect-ocr-enabled', on ? '1' : '0'); }catch(e){} }
function toggleOcr(){
  setOcrEnabled(!isOcrEnabled());
  renderScreen('settings');
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function cleanOcrText(raw){
  return escapeHtml(String(raw || '').replace(/\s+/g,' ').trim()).slice(0, 600);
}
// Preprocess a photo before handing it to Tesseract: upscale small images,
// convert to grayscale, and stretch contrast. This is all done on-device with
// a <canvas> — no new dependency, no network call — and meaningfully helps
// Tesseract read real phone-camera photos of glossy/small-print labels.
function preprocessForOcr(dataUrl){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = () => {
        try{
          // Upscale small photos — Tesseract does better with more pixels to work with.
          const minDim = 1200;
          const scale = Math.max(1, minDim / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const imageData = ctx.getImageData(0, 0, w, h);
          const d = imageData.data;

          // First pass: grayscale + find min/max luminance for contrast stretching.
          let min = 255, max = 0;
          const gray = new Uint8ClampedArray(w * h);
          for(let i = 0, p = 0; i < d.length; i += 4, p++){
            const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
            gray[p] = g;
            if(g < min) min = g;
            if(g > max) max = g;
          }
          const range = Math.max(1, max - min);

          // Second pass: stretch contrast so the darkest pixel is black and
          // the lightest is white, which helps a lot with glare/low-contrast labels.
          for(let i = 0, p = 0; i < d.length; i += 4, p++){
            const v = Math.round(((gray[p] - min) / range) * 255);
            d[i] = d[i+1] = d[i+2] = v;
          }
          ctx.putImageData(imageData, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        }catch(e){
          resolve(dataUrl); // if canvas processing fails for any reason, fall back to the original photo
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){
      resolve(dataUrl);
    }
  });
}
async function recognizeText(dataUrl){
  const processed = await preprocessForOcr(dataUrl);
  const result = await Tesseract.recognize(processed, 'eng');
  return (result && result.data && result.data.text) || '';
}

async function extractWithOcr(doc){
  if(doc.type === 'bottle'){
    const clean = cleanOcrText(await recognizeText(doc.image));
    return {
      type:"Medication",
      snippet: clean ? `...${clean.slice(0,220)}...` : "...(no text recognized)...",
      fields:[["Scanned text", clean || "No text recognized — try retaking the photo closer and in better light."]],
      confidence:"low",
      med:{ name:"(fill in from text above)", dose:"", frequency:"" },
      isOcrRaw: true
    };
  } else if(doc.type === 'otc'){
    const [frontClean, dirClean] = await Promise.all([
      recognizeText(doc.frontImage).then(cleanOcrText),
      recognizeText(doc.directionsImage).then(cleanOcrText)
    ]);
    return {
      type:"OTC Medicine",
      snippet: `...Front: ${frontClean ? frontClean.slice(0,120) : '(no text recognized)'}... Directions: ${dirClean ? dirClean.slice(0,160) : '(no text recognized)'}...`,
      fields:[
        ["Front label text", frontClean || "No text recognized."],
        ["Directions panel text", dirClean || "No text recognized."]
      ],
      confidence:"low",
      needsAgeConfirm:false,
      needsManualAgeEntry:true,
      manualRange:'',
      manualDose:'',
      productName:null,
      isOcrRaw: true
    };
  } else {
    const clean = cleanOcrText(await recognizeText(doc.image));
    return {
      type:"Other",
      snippet: clean ? `...${clean.slice(0,220)}...` : "...(no text recognized)...",

let _demoBottleIdx = 0, _demoDischargeIdx = 0, _demoOtcIdx = 0;
function resetDemoCounters(){ _demoBottleIdx = 0; _demoDischargeIdx = 0; _demoOtcIdx = 0; }

function demoItemFor(doc){
  if(doc.type === 'bottle'){
    const med = bottleMeds[_demoBottleIdx % bottleMeds.length];
    _demoBottleIdx++;
    return {
      type:"Medication",
      snippet:`...Label reads: <mark>${med.name} ${med.dose}</mark> — ${med.frequency}. Qty ${med.qty}. ${med.refill}. — ${med.pharmacy}...`,
      fields:[["Medication",med.name],["Dose",med.dose],["Frequency",med.frequency],["Refill",med.refill],["Pharmacy",med.pharmacy]],
      confidence:"high",
      med: Object.assign({}, med),
      isPlaceholder: true
    };
  } else if(doc.type === 'otc'){
    const tpl = otcTemplates[_demoOtcIdx % otcTemplates.length];
    _demoOtcIdx++;
    const multi = tpl.ageGroups.length > 1;
    const fields = multi
      ? [["Product", tpl.name]]
      : [["Product", tpl.name], ["Dose", tpl.ageGroups[0].dose], ["Who it's for", tpl.ageGroups[0].range], ["Frequency", tpl.frequency]];
    return {
      type:"OTC Medicine",
      snippet: multi
        ? `...Front label reads: <mark>${tpl.name}</mark>. Directions panel lists <mark>${tpl.ageGroups.length} age/weight brackets</mark> — confirm which one applies...`
        : `...Front label reads: <mark>${tpl.name}</mark>. Directions panel: <mark>${tpl.ageGroups[0].dose}</mark> for ${tpl.ageGroups[0].range}...`,
      fields,
      confidence:"high",
      ageGroups: tpl.ageGroups.map(g=>Object.assign({}, g)),
      frequency: tpl.frequency,
      productName: tpl.name,
      needsAgeConfirm: multi,
      selectedAgeIdx: multi ? null : 0,
      isPlaceholder: true
    };
  } else {
    const tpl = dischargeTemplates[_demoDischargeIdx % dischargeTemplates.length];
    _demoDischargeIdx++;
    return Object.assign({}, tpl, {fields: tpl.fields.map(f=>f.slice()), isPlaceholder: true});
  }
}

let verifyItems = [];
let confirmedItems = [];
let verifyIdx = 0;
function renderVerifyStep(){
  if(verifyItems.length === 0){
    document.querySelector('.app-body').innerHTML = `
      <div class="empty-state">
        <div class="emoji">🧾</div>
        <h2 class="screen-title" style="margin-bottom:6px;">Nothing to verify yet</h2>
        <p class="screen-sub">Scan something first — Kin-Nect will pull it through here before it reaches the dashboard.</p>
        <button class="cta-btn static" onclick="goTo('upload')">Go to Scan →</button>
      </div>`;
    return;
  }
  if(verifyIdx >= verifyItems.length){
    document.querySelector('.app-body').innerHTML = `
      <div style="text-align:center;padding-top:60px;">
        <div style="font-size:44px;margin-bottom:10px;">✅</div>
        <h2 class="screen-title" style="margin-bottom:6px;">All items confirmed</h2>
        <p class="screen-sub">${verifyItems.length} of ${verifyItems.length} verified. Your family dashboard is up to date.</p>
        <button class="cta-btn static" onclick="goTo('dashboard')">Open the Dashboard →</button>
      </div>`;
    return;
  }
  const item = verifyItems[verifyIdx];
  document.getElementById('vp-label').textContent = item.type;
  document.getElementById('vp-count').textContent = `Item ${verifyIdx+1} of ${verifyItems.length}`;
  document.getElementById('vp-bar').style.width = `${(verifyIdx/verifyItems.length)*100}%`;
  document.getElementById('vp-snippet').innerHTML = item.snippet;
  const confEl = document.getElementById('vp-conf');
  if(item.isPlaceholder){
    confEl.textContent = '⚠ PLACEHOLDER — not read from your photo';
    confEl.className = 'confbadge low';
  } else {
    confEl.textContent = item.confidence === 'high' ? 'High confidence' : 'Please double-check';
    confEl.className = 'confbadge ' + (item.confidence === 'high' ? 'high' : 'low');
  }
  document.getElementById('vp-fields').innerHTML = item.fields.map(f=>`<div class="field-row"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('');

  // OTC boxes with more than one dosing group need an explicit age
  // confirmation before they can be saved to the family dashboard —
  // either picking from auto-detected brackets (demo data) or typing in
  // what they read off the OCR'd directions panel (real on-device OCR,
  // which can't reliably auto-split a dosing chart on its own).
  const ageCard = document.getElementById('vp-age-card');
  const confirmBtn = document.querySelector('.btn-confirm');
  if(ageCard){
    if(item.needsAgeConfirm){
      document.getElementById('vp-age-card-title').textContent = 'Which age range applies?';
      document.getElementById('vp-age-card-hint').textContent = "This box lists more than one dose — pick the one that's right for who it's for before saving.";
      ageCard.style.display = 'block';
      document.getElementById('vp-age-body').innerHTML = `<div id="vp-age-options" class="age-options">${item.ageGroups.map((g,idx)=>`
        <button class="age-option ${item.selectedAgeIdx===idx?'selected':''}" onclick="selectAgeGroup(${idx})">
          <span>${g.range}</span><span class="age-dose">${g.dose}</span>
        </button>`).join('')}</div>`;
    } else if(item.needsManualAgeEntry){
      document.getElementById('vp-age-card-title').textContent = 'Which age range & dose applies?';
      document.getElementById('vp-age-card-hint').textContent = "On-device text scanning can't automatically split a dosing chart into brackets — read the directions text above, then enter the range and dose for this person.";
      ageCard.style.display = 'block';
      document.getElementById('vp-age-body').innerHTML = `
        <div class="edit-row"><label>Age / weight range</label><input type="text" id="vp-manual-range" value="${(item.manualRange||'').replace(/"/g,'&quot;')}" oninput="onManualAgeInput()" placeholder="e.g. 6–8 yrs (48–59 lb)" /></div>
        <div class="edit-row"><label>Dose</label><input type="text" id="vp-manual-dose" value="${(item.manualDose||'').replace(/"/g,'&quot;')}" oninput="onManualAgeInput()" placeholder="e.g. 10 mL" /></div>`;
    } else {
      ageCard.style.display = 'none';
    }
  }
  if(confirmBtn){
    let blocked = false;
    if(item.needsAgeConfirm) blocked = item.selectedAgeIdx === null;
    else if(item.needsManualAgeEntry) blocked = !(item.manualRange||'').trim() || !(item.manualDose||'').trim();
    confirmBtn.disabled = blocked;
    confirmBtn.textContent = blocked
      ? (item.needsManualAgeEntry ? 'Enter age range & dose first' : 'Select an age range above first')
      : '✓ Looks right';
  }
}
function selectAgeGroup(idx){
  const item = verifyItems[verifyIdx];
  if(!item) return;
  item.selectedAgeIdx = idx;
  renderVerifyStep();
}
// Lightweight update for the manual age/dose text inputs — avoids a full
// re-render (and losing cursor focus) on every keystroke.
function onManualAgeInput(){
  const item = verifyItems[verifyIdx];
  if(!item) return;
  const rangeEl = document.getElementById('vp-manual-range');
  const doseEl = document.getElementById('vp-manual-dose');
  item.manualRange = rangeEl ? rangeEl.value : '';
  item.manualDose = doseEl ? doseEl.value : '';
  const confirmBtn = document.querySelector('.btn-confirm');
  if(confirmBtn){
    const blocked = !item.manualRange.trim() || !item.manualDose.trim();
    confirmBtn.disabled = blocked;
    confirmBtn.textContent = blocked ? 'Enter age range & dose first' : '✓ Looks right';
  }
}
function confirmVerify(){
  const item = verifyItems[verifyIdx];
  if(item.needsAgeConfirm && item.selectedAgeIdx === null){
    showToast('Please select the age range that applies first');
    return;
  }
  if(item.needsManualAgeEntry && (!(item.manualRange||'').trim() || !(item.manualDose||'').trim())){
    showToast('Please enter the age range and dose that applies first');
    return;
  }
  if(item.needsAgeConfirm){
    const g = item.ageGroups[item.selectedAgeIdx];
    item.fields = [["Product", item.productName], ["Dose", g.dose], ["Who it's for", g.range], ["Frequency", item.frequency]];
  } else if(item.needsManualAgeEntry){
    item.fields = [["Dose", item.manualDose], ["Who it's for", item.manualRange]].concat(item.fields);
  }
  confirmedItems.push(item);
  verifyIdx++;
  showToast('✓ Saved to your dashboard');
  renderVerifyStep();
}
function openEditModal(){
  if(verifyIdx >= verifyItems.length) return;
  const item = verifyItems[verifyIdx];
  const rows = item.fields.map((f,i)=>`
    <div class="edit-row">
      <label>${f[0]}</label>
      <input type="text" id="edit-field-${i}" value="${String(f[1]).replace(/"/g,'&quot;')}" />
    </div>`).join('');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'editBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Edit ${item.type}</h3>
      <p>Correct anything Kin-Nect read wrong — this updates what's saved to the family dashboard.</p>
      ${rows}
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-modal-save" onclick="saveEditModal()">Save changes</button>
      </div>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeEditModal(); });
  document.body.appendChild(backdrop);
}
function closeEditModal(){
  const b = document.getElementById('editBackdrop');
  if(b) b.remove();
}
function saveEditModal(){
  const item = verifyItems[verifyIdx];
  item.fields.forEach((f,i)=>{
    const input = document.getElementById(`edit-field-${i}`);
    if(input) f[1] = input.value;
  });
  if(item.med){
    const nameField = item.fields.find(f=>f[0]==='Medication');
    const doseField = item.fields.find(f=>f[0]==='Dose');
    const freqField = item.fields.find(f=>f[0]==='Frequency');
    if(nameField) item.med.name = nameField[1];
    if(doseField) item.med.dose = doseField[1];
    if(freqField) item.med.frequency = freqField[1];
  }
  closeEditModal();
  showToast('✎ Field updated');
  renderVerifyStep();
}

          <span class="scan-label">Scan Discharge<br/>Papers</span>
          <span class="scan-sub">Care instructions</span>
        </button>
        <button class="scan-card otc" onclick="triggerScan('otc')">
          <span class="icon-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="8" width="16" height="12" rx="1.5" stroke="#a34f10" stroke-width="1.6"/><path d="M4 8l3-4h10l3 4" stroke="#a34f10" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 8v3M15 8v3" stroke="#a34f10" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
          <span class="scan-label">Scan OTC<br/>Medicine</span>
          <span class="scan-sub">Front + directions</span>
        </button>
      </div>
      <p class="upload-hint">💊 Bottle labels give Kin-Nect the medication, dose, and refill info. 📄 Discharge papers give appointments, wound care, and warning signs. 📦 OTC boxes capture the front label and directions panel — if the dosing chart lists more than one age range, Kin-Nect will ask you to confirm which one applies. Tap ✕ on a thumbnail to remove it.</p>
      <div class="thumb-grid" id="thumbGrid"></div>
    `;
    footerHTML = `<div class="cta-bar"><button class="cta-btn" id="processBtn" onclick="startProcessing();">Scan a document to begin</button></div>`;
  } else if(name === 'parse'){
    bodyHTML = `
      <div class="parse-wrap">
        <div class="ring" id="ring" style="--pct:0"><div class="ring-inner" id="ringPct">0%</div></div>
        <div class="steplist" id="stepList"></div>
      </div>
    `;
    footerHTML = `<div class="cta-bar"><button class="cta-btn ghost" id="parseContinue" style="display:none;" onclick="goTo('verify'); verifyIdx=0; renderVerifyStep();">Continue to Verification →</button></div>`;
  } else if(name === 'verify'){
    bodyHTML = `
      <h2 class="screen-title">Confirm each item</h2>
      <p class="screen-sub">Nothing reaches the family dashboard until you confirm it's correct.</p>
      <div class="verify-progress"><span id="vp-label"></span><span id="vp-count"></span></div>
      <div class="bar-track"><div class="bar-fill" id="vp-bar"></div></div>
      <div class="doc-card"><span class="label">Original document — page snippet</span><span id="vp-snippet"></span></div>
      <div class="extract-card">
        <div class="label"><span>Kin-Nect extracted</span><span class="confbadge" id="vp-conf"></span></div>
        <div id="vp-fields"></div>
      </div>
      <div class="extract-card" id="vp-age-card" style="display:none;">
        <div class="label"><span id="vp-age-card-title">Which age range applies?</span></div>
        <p class="age-hint" id="vp-age-card-hint"></p>
        <div id="vp-age-body"></div>
      </div>
      <div class="verify-actions">
        <button class="btn-confirm" onclick="confirmVerify()">✓ Looks right</button>
        <button class="btn-edit" onclick="openEditModal()">✎ Edit</button>
      </div>
    `;
  } else if(name === 'dashboard'){
    bodyHTML = dashboardBodyHTML();
  } else if(name === 'family'){
    bodyHTML = familyBodyHTML();
  } else if(name === 'settings'){
    bodyHTML = settingsBodyHTML();
  }

  const appEl = document.getElementById('app');
  appEl.innerHTML = `
    <div class="app-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="12" r="4" fill="#2a78d6"/><circle cx="17" cy="12" r="4" fill="#1baf7a"/><path d="M10.5 12h3" stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round"/></svg>
        Kin-Nect
      </div>
      <div class="header-right">
        <button class="theme-header-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">${theme === 'dark'
          ? '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="var(--ink-1)" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="var(--ink-1)" stroke-width="1.6" stroke-linecap="round"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 0110.2 4a8.5 8.5 0 109.8 10.5z" stroke="var(--ink-1)" stroke-width="1.7" stroke-linejoin="round"/></svg>'
        }</button>
        <div class="avatar-mini">C</div>
      </div>
    </div>
    <div class="app-body">${bodyHTML}</div>
    ${footerHTML}
    ${showNav ? bottomNavHTML(activeNavKey) : ''}
  `;

  if(name==='upload'){ renderThumbGrid(); }
  if(name==='verify'){ renderVerifyStep(); }
}

// ---------- dark mode ----------
// Defaults to the phone's system setting, then remembers whatever the
// person picks in Settings (stored locally on their device only).
let theme = 'light';
try{
  const saved = localStorage.getItem('kinnect-theme');
  theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}catch(e){ /* localStorage unavailable — fall back to light */ }
function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'dark' ? '#1c1c1e' : '#fcfcfb');
  try{ localStorage.setItem('kinnect-theme', t); }catch(e){}
}
function toggleTheme(){
  applyTheme(theme === 'dark' ? 'light' : 'dark');
  renderScreen(currentScreen);
}
applyTheme(theme);

// init
renderScreen('upload');
</script>
</body>
</html>
