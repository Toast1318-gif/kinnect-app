}
function setVerifyForWhom(memberId){
  const item = verifyItems[verifyIdx];
  if(item) item.forWhom = memberId;
}
function selectAgeGroup(idx){
  const item = verifyItems[verifyIdx];
  if(!item) return;
  item.selectedAgeIdx = idx;
  const g = item.ageGroups && item.ageGroups[idx];
  if(g && g.dose) applyDoseTextToScheduleDraft(g.dose, item);
  renderVerifyStep();
}
// Reads a dosing-chart sentence like "take 2 tablets every 4 to 6 hours do
// not take more than 8 tablets in 24 hours" and turns it into a schedule so
// picking an age bracket fills in the Frequency + Times section below it —
// the person can still check/adjust it, but doesn't have to retype what the
// box already told them.
function parseDoseFrequencyText(doseText){
  if(!doseText) return null;
  const text = doseText.toLowerCase();
  let intervalHours = null;
  const takeM = text.match(/take\s+([\d.]+)\s*tablets?/);
  const maxM = text.match(/(?:no more than|not more than)\s+([\d.]+)\s*tablets?\s*in\s*24\s*hours/);
  if(takeM && maxM){
    const perDose = parseFloat(takeM[1]);
    const maxDaily = parseFloat(maxM[1]);
    if(perDose > 0 && maxDaily > 0){
      const dosesPerDay = maxDaily / perDose;
      if(dosesPerDay > 0) intervalHours = Math.round(24 / dosesPerDay);
    }
  }
  if(!intervalHours){
    const rangeM = text.match(/every\s+(\d+)\s*(?:to|-)\s*(\d+)\s*hours?/);
    const singleM = text.match(/every\s+(\d+)\s*hours?/);
    if(rangeM) intervalHours = parseInt(rangeM[2],10);
    else if(singleM) intervalHours = parseInt(singleM[1],10);
  }
  if(!intervalHours){
    if(/once (a |per )?day|once daily/.test(text)) intervalHours = 24;
    else if(/twice (a |per )?day|twice daily|two times a day/.test(text)) intervalHours = 12;
    else if(/three times a day|thrice daily/.test(text)) intervalHours = 8;
    else if(/four times a day/.test(text)) intervalHours = 6;
  }
  if(!intervalHours || intervalHours < 1 || intervalHours > 24) return null;
  return { intervalHours: Math.max(1, Math.min(24, intervalHours)) };
}
function buildFrequencyLabel(doseText){
  const text = doseText.toLowerCase();
  const rangeM = text.match(/every\s+(\d+)\s*(?:to|-)\s*(\d+)\s*hours?/);
  const singleM = text.match(/every\s+(\d+)\s*hours?/);
  const takeM = text.match(/take\s+([\d.]+)\s*tablets?/);
  const plural = n => parseFloat(n) === 1 ? '' : 's';
  if(takeM && rangeM) return `${takeM[1]} tablet${plural(takeM[1])} every ${rangeM[1]}–${rangeM[2]} hours`;
  if(takeM && singleM) return `${takeM[1]} tablet${plural(takeM[1])} every ${singleM[1]} hours`;
  if(rangeM) return `Every ${rangeM[1]}–${rangeM[2]} hours`;
  if(singleM) return `Every ${singleM[1]} hours`;
  return doseText.charAt(0).toUpperCase() + doseText.slice(1);
}
function applyDoseTextToScheduleDraft(doseText, forItem){
  if(!scheduleDraft || (forItem && scheduleDraft.__forVerifyItem !== forItem)) return;
  const freqEl = document.getElementById('vp-schedule-freq');
  if(freqEl) freqEl.value = buildFrequencyLabel(doseText);
  const parsed = parseDoseFrequencyText(doseText);
  if(parsed){
    scheduleDraft.mode = 'interval';
    scheduleDraft.intervalHours = parsed.intervalHours;
    if(!scheduleDraft.intervalStart) scheduleDraft.intervalStart = nowTimeStr();
    scheduleDraft.times = computeIntervalTimes(scheduleDraft.intervalStart, scheduleDraft.intervalHours);
  }
}
// "Something else" on the bracket picker — some real scans mis-split a
// bracket or miss one entirely, so there's always a manual way out rather
// than forcing a pick from potentially-wrong auto-detected options.
function useCustomAge(){
  const item = verifyItems[verifyIdx];
  if(!item) return;
  item.useCustomAge = true;
  renderVerifyStep();
}
function useAgeBrackets(){
  const item = verifyItems[verifyIdx];
  if(!item) return;
  item.useCustomAge = false;
  renderVerifyStep();
}
// Lightweight update for the manual age/dose text inputs — avoids a full
// re-render (and losing cursor focus) on every keystroke.
function onManualAgeInput(){
  const item = verifyItems[verifyIdx];
  if(!item) return;
  const rangeEl = document.getElementById('vp-manual-range');
  const doseEl = document.getElementById('vp-manual-dose');
  item.manualRange = rangeEl ? rangeEl.value : '';
  item.manualDose = doseEl ? doseEl.value : '';
  const confirmBtn = document.querySelector('.btn-confirm');
  if(confirmBtn){
    const blocked = !item.manualRange.trim() || !item.manualDose.trim();
    confirmBtn.disabled = blocked;
    confirmBtn.textContent = blocked ? 'Enter age range & dose first' : '✓ Looks right';
  }
}
function confirmVerify(){
  const item = verifyItems[verifyIdx];
  const usingCustomAge = item.needsAgeConfirm && item.useCustomAge;
  if(item.needsAgeConfirm && !item.useCustomAge && item.selectedAgeIdx === null){
    showToast('Please select the age range that applies first');
    return;
  }
  if((usingCustomAge || item.needsManualAgeEntry) && (!(item.manualRange||'').trim() || !(item.manualDose||'').trim())){
    showToast('Please enter the age range and dose that applies first');
    return;
  }
  if(usingCustomAge){
    item.fields = [["Product", item.productName || "OTC Medicine"], ["Dose", item.manualDose], ["Who it's for", item.manualRange]];
  } else if(item.needsAgeConfirm){
    const g = item.ageGroups[item.selectedAgeIdx];
    item.fields = [["Product", item.productName || "OTC Medicine"], ["Dose", g.dose], ["Who it's for", g.range]]
      .concat(item.frequency ? [["Frequency", item.frequency]] : []);
  } else if(item.needsManualAgeEntry){
    item.fields = [["Dose", item.manualDose], ["Who it's for", item.manualRange]].concat(item.fields);
  }
  if(isSchedulableType(item.type)){
    if(scheduleDraft && !scheduleDraft.times.length){
      showToast('Add at least one time before saving');
      return;
    }
    if(scheduleDraft && scheduleDraft.__forVerifyItem === item){
      const clean = Object.assign({}, scheduleDraft);
      delete clean.__containerId;
      delete clean.__forVerifyItem;
      item.schedule = clean;
    }
    const freqEl = document.getElementById('vp-schedule-freq');
    const freqVal = freqEl ? freqEl.value : '';
    if(item.med) item.med.frequency = freqVal;
    else {
      const f = item.fields.find(f=>f[0]==='Frequency');
      if(f) f[1] = freqVal; else item.fields.push(['Frequency', freqVal]);
    }
  }
  const dup = findLikelyDuplicate(item);
  if(dup){
    showDuplicateWarning(item, dup);
    return;
  }
  finalizeAndSaveItem(item);
  scheduleDraft = null;
  verifyIdx++;
  showToast('✓ Saved to your dashboard');
  renderVerifyStep();
}
function showDuplicateWarning(item, dup){
  const name = itemDisplayName(item);
  const forName = familyMemberName(item.forWhom) || 'them';
  const minsAgo = Math.max(1, Math.round((Date.now() - (dup.createdAt || Date.now())) / 60000));
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'dupBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Looks like this was already added</h3>
      <p>"${escapeHtml(name)}" was added for ${escapeHtml(forName)} about ${minsAgo} minute${minsAgo===1?'':'s'} ago — probably from testing or rescanning, rather than a real second course.</p>
      <button class="choice-btn" onclick="skipDuplicateItem()">Skip this one — it's a duplicate</button>
      <button class="choice-btn" onclick="addDuplicateAnyway()">Add it anyway — it's a real separate item</button>
      <button class="btn-modal-cancel" style="width:100%;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;" onclick="closeDuplicateWarning()">Cancel — let me look again</button>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeDuplicateWarning(); });
  document.body.appendChild(backdrop);
}
function closeDuplicateWarning(){
  const b = document.getElementById('dupBackdrop');
  if(b) b.remove();
}
function skipDuplicateItem(){
  closeDuplicateWarning();
  scheduleDraft = null;
  verifyIdx++;
  showToast('Skipped as a duplicate');
  renderVerifyStep();
}
function addDuplicateAnyway(){
  closeDuplicateWarning();
  const item = verifyItems[verifyIdx];
  finalizeAndSaveItem(item);
  scheduleDraft = null;
  verifyIdx++;
  showToast('✓ Saved to your dashboard');
  renderVerifyStep();
}
function openEditModal(){
  if(verifyIdx >= verifyItems.length) return;
  const item = verifyItems[verifyIdx];
  const rows = item.fields.map((f,i)=>`
    <div class="edit-row">
      <label>${f[0]}</label>
      <input type="text" id="edit-field-${i}" value="${String(f[1]).replace(/"/g,'&quot;')}" />
    </div>`).join('');
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'editBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Edit ${item.type}</h3>
      <p>Correct anything Kin-Nect read wrong — this updates what's saved to the family dashboard.</p>
      ${rows}
      <div class="modal-actions">
        <button class="btn-modal-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-modal-save" onclick="saveEditModal()">Save changes</button>
      </div>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeEditModal(); });
  document.body.appendChild(backdrop);
}
function closeEditModal(){
  const b = document.getElementById('editBackdrop');
  if(b) b.remove();
}
function saveEditModal(){
  const item = verifyItems[verifyIdx];
  item.fields.forEach((f,i)=>{
    const input = document.getElementById(`edit-field-${i}`);
    if(input) f[1] = input.value;
  });
  if(item.med){
    const nameField = item.fields.find(f=>f[0]==='Medication');
    const doseField = item.fields.find(f=>f[0]==='Dose');
    const freqField = item.fields.find(f=>f[0]==='Frequency');
    if(nameField) item.med.name = nameField[1];
    if(doseField) item.med.dose = doseField[1];
    if(freqField) item.med.frequency = freqField[1];
  }
  closeEditModal();
  showToast('✎ Field updated');
  renderVerifyStep();
}

// ---------- SCREEN: dashboard ----------
const instrIcons = {
  "Wound Care":"🩹",
  "Red-Flag Symptom":"🚨",
  "Activity Restriction":"🚶",
  "Diet Instructions":"🥗"
};

// A schedulable item's dose-time slots only show up on days the schedule
// actually covers — day-of-week selection, plus a start date and optional
// fixed duration for things like a short antibiotic course.
// For a fixed-length course (e.g. "7-day antibiotic"), shows how far into
// it a person is — "Day 3/7" — so a caregiver can tell at a glance without
// doing date math themselves. Ongoing/ no-duration items return null (no badge).
function courseDayLabel(item, dateStr){
  const sched = item.schedule;
  if(!sched || sched.durationMode !== 'fixed' || !sched.startDate || !sched.durationDays) return null;
  const startD = new Date(sched.startDate + 'T00:00:00');
  const curD = new Date((dateStr || todayStr()) + 'T00:00:00');
  const dayNum = Math.round((curD - startD) / 86400000) + 1;
  if(dayNum < 1 || dayNum > sched.durationDays) return null;
  return `Day ${dayNum}/${sched.durationDays}`;
}
function isItemActiveOn(item, dateStr){
  const sched = item.schedule;
  if(!sched) return true;
  const days = (sched.days && sched.days.length) ? sched.days : [0,1,2,3,4,5,6];
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  if(!days.includes(dow)) return false;
  if(sched.durationMode === 'fixed' && sched.startDate){
    if(dateStr < sched.startDate) return false;
    if(sched.durationDays){
      const startD = new Date(sched.startDate + 'T00:00:00');
      const endD = new Date(startD);
      endD.setDate(endD.getDate() + sched.durationDays - 1);
      const endStr = endD.getFullYear() + '-' + pad2(endD.getMonth()+1) + '-' + pad2(endD.getDate());
      if(dateStr > endStr) return false;
    }
  }
  return true;
}
function slotStatusFor(item, time, now, dateStr){
  const key = dateStr + '|' + time;
  if(item.takenLog && item.takenLog[key]) return 'taken';
  const [h,m] = time.split(':').map(Number);
  const slot = new Date(dateStr + 'T00:00:00');
  slot.setHours(h, m, 0, 0);
  return now.getTime() >= slot.getTime() ? 'overdue' : 'due';
}
function itemDisplayName(item){
  if(item.med) return `${item.med.name}${item.med.dose ? ' ' + item.med.dose : ''}`.trim();
  const product = (item.fields.find(f=>f[0]==='Product')||[])[1];
  return product || item.type || 'Item';
}
function toggleMedSlot(itemId, time, dateStr){
  const item = confirmedItems.find(i=>i.id===itemId);
  if(!item) return;
  if(!item.takenLog) item.takenLog = {};
  const key = (dateStr || todayStr()) + '|' + time;
  if(item.takenLog[key]) delete item.takenLog[key];
  else item.takenLog[key] = Date.now();
  saveConfirmedItems();
  renderScreen('dashboard');
}
const TRASH_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
      <path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>
      <path d="M10 11v6M14 11v6"/>
    </svg>`;
function trashBtnHTML(itemId, label){
  return `<button class="delete-btn" onclick="event.stopPropagation(); deleteConfirmedItem('${itemId}')" title="Remove ${escapeHtml(label||'item')}" aria-label="Remove ${escapeHtml(label||'item')}">${TRASH_ICON_SVG}</button>`;
}
// Medication/OTC rows are one occurrence of a recurring schedule, so a bare
// delete is ambiguous — did they mean "I already gave this dose, hide it"
// or "stop reminding me about this medicine entirely"? This asks first
// instead of guessing, since silently deleting the whole series when
// someone only meant to clear today's row would be a bad surprise.
function trashBtnDoseHTML(itemId, time, label, dateStr){
  return `<button class="delete-btn" onclick="event.stopPropagation(); openDoseDeleteChoice('${itemId}','${time}','${dateStr}')" title="Remove ${escapeHtml(label||'dose')}" aria-label="Remove ${escapeHtml(label||'dose')}">${TRASH_ICON_SVG}</button>`;
}
function openDoseDeleteChoice(itemId, time, dateStr){
  const item = confirmedItems.find(i=>i.id===itemId);
  if(!item) return;
  const name = itemDisplayName(item);
  const timeLabel = formatTimeLabel(time);
  const isToday = dateStr === todayStr();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'doseDeleteBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Remove ${escapeHtml(name)}?</h3>
      <p>This repeats on a schedule — choose what to remove.</p>
      <button class="choice-btn" onclick="skipSingleDose('${itemId}','${time}','${dateStr}')">Just ${isToday ? "today's" : `${formatFriendlyDate(dateStr)}'s`} ${timeLabel} dose</button>
      <button class="choice-btn danger" onclick="deleteConfirmedItem('${itemId}')">The whole series (all upcoming doses)</button>
      <button class="btn-modal-cancel" style="width:100%;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;" onclick="closeDoseDeleteChoice()">Cancel</button>
    </div>`;
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) closeDoseDeleteChoice(); });
  document.body.appendChild(backdrop);
}
function closeDoseDeleteChoice(){
  const b = document.getElementById('doseDeleteBackdrop');
  if(b) b.remove();
}
function skipSingleDose(itemId, time, dateStr){
  const item = confirmedItems.find(i=>i.id===itemId);
  if(!item) return;
  if(!item.skippedDoses) item.skippedDoses = {};
  item.skippedDoses[(dateStr || todayStr()) + '|' + time] = true;
  saveConfirmedItems();
  closeDoseDeleteChoice();
  showToast(`🗑️ Removed that ${formatTimeLabel(time)} dose`);
  renderScreen('dashboard');
}
function deleteConfirmedItem(itemId){
  closeDoseDeleteChoice();
  const idx = confirmedItems.findIndex(i=>i.id===itemId);
  if(idx === -1) return;
  const removed = confirmedItems[idx];
  confirmedItems.splice(idx,1);
  saveConfirmedItems();
  showToast(`🗑️ Removed ${itemDisplayName(removed)}`);
  renderScreen('dashboard');
}

// "All" or a specific family member id — lets a multi-person household (e.g.
// Mom and Grandpa both on the same Kin-Nect) see one person's plan at a time
// instead of everything blurred into one list.
let dashboardPersonFilter = 'all';
function setDashboardPersonFilter(id){

}
// Which day's doses the medication checklist is currently showing — lets
// someone page forward to preview an upcoming day's schedule, or back to
// double-check a day that's passed, without losing "today" as home base
// (goTo('dashboard') — i.e. tapping the Home tab — always snaps this back).
let dashboardViewDate = todayStr();
function shiftDashboardDay(delta){
  const d = new Date(dashboardViewDate + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  dashboardViewDate = d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  renderScreen('dashboard');
}
function resetDashboardDay(){
  dashboardViewDate = todayStr();
  renderScreen('dashboard');
}

// ---------- "get set up" tracker (Home) ----------
// Tracks three real actions — separate from just checking confirmedItems.length,
// because the seed family members and empty documents array don't tell us
// whether a *real* person actually did each step yet.
function markSetupStep(key){ try{ localStorage.setItem('kinnect-setup-' + key, '1'); }catch(e){} }
function hasSetupStep(key){ try{ return localStorage.getItem('kinnect-setup-' + key) === '1'; }catch(e){ return false; } }
function isSetupTrackerDismissed(){ return hasSetupStep('tracker-dismissed'); }
function dismissSetupTracker(){ markSetupStep('tracker-dismissed'); renderScreen('dashboard'); }
function setupTrackerHTML(){
  if(isSetupTrackerDismissed()) return '';
  const steps = [
    { done: hasSetupStep('family-added'), label:'Add a family member', sub:'Who are you caring for?', icon:'👪', go:'family' },
    { done: hasSetupStep('scanned'), label:'Scan a medicine', sub:'Bottle, OTC box, or discharge papers', icon:'📷', go:'upload' },
    { done: hasSetupStep('scheduled'), label:'Create a schedule', sub:'Kin-Nect builds the dose times', icon:'🗓️', go:'upload' },
  ];
  const allDone = steps.every(s => s.done);
  if(allDone){
    return `
    <div class="setup-tracker setup-tracker-done">
      <div class="setup-done-emoji">🎉</div>
      <div class="setup-done-text">
        <div class="setup-done-title">You're all set!</div>
        <div class="setup-done-sub">Family added, medicine scanned, schedule created.</div>
      </div>
      <button class="setup-dismiss" onclick="dismissSetupTracker()" aria-label="Dismiss">✕</button>
    </div>`;
  }
  const doneCount = steps.filter(s=>s.done).length;
  const rows = steps.map((s,i)=>`
    <button class="setup-step ${s.done?'done':''}" onclick="goTo('${s.go}')">
      <span class="setup-step-check">${s.done ? '✓' : (i+1)}</span>
      <span class="setup-step-icon">${s.icon}</span>
      <span class="setup-step-text">
        <span class="setup-step-label">${escapeHtml(s.label)}</span>
        <span class="setup-step-sub">${escapeHtml(s.sub)}</span>

function dashboardBodyHTML(){
  if(confirmedItems.length === 0){
    return `
      ${setupTrackerHTML()}
      <div class="empty-state">
        <div class="emoji">📭</div>
        <h2 class="screen-title" style="margin-bottom:6px;">No scans confirmed yet</h2>
        <p class="screen-sub">Scan a medicine bottle or discharge paper and confirm it — the dashboard only fills in with what's actually been verified.</p>
        <button class="cta-btn static" onclick="goTo('upload')">Go to Scan →</button>
      </div>`;
  }

  const peopleInPlan = familyMembers.filter(m => confirmedItems.some(i=>i.forWhom===m.id));
  const filterHTML = peopleInPlan.length > 1 ? `
    <div class="person-filter-row">
      <button class="person-tab ${dashboardPersonFilter==='all'?'active':''}" onclick="setDashboardPersonFilter('all')">All</button>
      ${peopleInPlan.map(m=>`<button class="person-tab ${dashboardPersonFilter===m.id?'active':''}" onclick="setDashboardPersonFilter('${m.id}')">${escapeHtml(m.name)}</button>`).join('')}
    </div>` : '';
  const visibleItems = dashboardPersonFilter === 'all' ? confirmedItems : confirmedItems.filter(i=>i.forWhom===dashboardPersonFilter);
  const filteredName = dashboardPersonFilter !== 'all' ? familyMemberName(dashboardPersonFilter) : null;

  const meds = visibleItems.filter(i=>isSchedulableType(i.type));
  const appts = visibleItems.filter(i=>i.type==='Follow-up Appointment');
  const others = visibleItems.filter(i=>!isSchedulableType(i.type) && i.type!=='Follow-up Appointment');

  const now = new Date();
  const today = todayStr();
  const viewDate = dashboardViewDate;
  const isViewingToday = viewDate === today;
  const schedRows = [];
  meds.forEach(item=>{
    if(!isItemActiveOn(item, viewDate)) return;
    const sched = item.schedule;
    let times = (sched && sched.times && sched.times.length) ? sched.times.slice().sort() : ['09:00'];
    // "Every X hours" schedules space doses across a full 24-hour clock
    // cycle, which can wrap around to times earlier in the day than the
    // actual start time (e.g. starting at 10 PM on a 6-hour interval computes
    // 4/10/16/22). On the day dosing actually starts, only the start time
    // itself (and anything later that same day) really happened — the
    // earlier-clock-time slots belong to the cycle continuing the *next*
    // day, not to day 1.
    if(sched && sched.mode === 'interval' && sched.startDate === viewDate && sched.intervalStart){
      times = times.filter(t => t >= sched.intervalStart);
    }
    times.forEach(t => {
      if(item.skippedDoses && item.skippedDoses[viewDate + '|' + t]) return;
      schedRows.push({ item, time: t });
    });
  });
  // Chronological — earliest dose of the day at the top, regardless of
  // which medication it belongs to — rather than grouped medication-by-medication.
  schedRows.sort((a,b) => a.time.localeCompare(b.time));
  const tasksDone = schedRows.filter(r => slotStatusFor(r.item, r.time, now, viewDate) === 'taken').length;

  const dayBadgeShown = new Set();
  const medHTML = schedRows.length ? schedRows.map(r=>{
    const status = slotStatusFor(r.item, r.time, now, viewDate);
    const chipClass = status === 'taken' ? 'taken' : (status === 'overdue' ? 'overdue' : 'due');
    const chipLabel = status === 'taken' ? 'Taken' : (status === 'overdue' ? 'Overdue' : `Due ${formatTimeLabel(r.time)}`);
    const name = itemDisplayName(r.item);
    const freq = r.item.med ? r.item.med.frequency : ((r.item.fields.find(f=>f[0]==='Frequency')||[])[1] || '');
    const forName = familyMemberName(r.item.forWhom);
    const forBadge = (dashboardPersonFilter === 'all' && forName) ? `<div class="mini-avatar" style="background:${avatarColorFor(forName)};" title="${escapeHtml(forName)}">${escapeHtml(forName.charAt(0).toUpperCase())}</div>` : '';
    // Shown once per medication per day — not repeated on every dose row of
    // the same medicine, since the day count doesn't change between doses.
    const dayLabel = courseDayLabel(r.item, viewDate);
    let dayBadge = '';
    if(dayLabel && !dayBadgeShown.has(r.item.id)){
      dayBadge = `<span class="course-badge">${dayLabel}</span>`;
      dayBadgeShown.add(r.item.id);
    }
    return `
    <div class="med-item" onclick="openScheduleModal('${r.item.id}')">
      <div class="checkbox ${status==='taken'?'checked':''}" onclick="event.stopPropagation(); toggleMedSlot('${r.item.id}','${r.time}','${viewDate}')">${status==='taken'?'✓':''}</div>
      <div class="med-info"><div class="med-name">${escapeHtml(name)}${dayBadge}</div><div class="med-sub">${formatTimeLabel(r.time)}${freq ? ' · ' + escapeHtml(freq) : ''}</div></div>
      ${forBadge}
      <div class="status-chip ${chipClass}">${chipLabel}</div>
      ${trashBtnDoseHTML(r.item.id, r.time, name, viewDate)}
    </div>`;
  }).join('') : `<p class="screen-sub" style="margin:0 0 12px;">Nothing scheduled for ${isViewingToday ? 'today' : 'this day'}. ${isViewingToday ? 'Tap a medicine on your dashboard to set its schedule, or scan/add one.' : ''}</p>`;

  const dayNavHTML = `
    <div class="day-nav">
      <button type="button" class="day-nav-arrow" onclick="shiftDashboardDay(-1)" aria-label="Previous day">‹</button>
      <div class="day-nav-center">
        <div class="day-nav-date">${formatFriendlyDate(viewDate)}${isViewingToday ? '<span class="day-nav-todaytag">Today</span>' : ''}</div>
        ${!isViewingToday ? `<button type="button" class="day-nav-today-link" onclick="resetDashboardDay()">↩ Jump to today</button>` : ''}
      </div>
      <button type="button" class="day-nav-arrow" onclick="shiftDashboardDay(1)" aria-label="Next day">›</button>
    </div>`;

  const apptHTML = appts.length ? appts.map(a=>{
    const get = k => (a.fields.find(f=>f[0]===k)||[])[1] || '';
    const dateStr = get('Date') || '';
    const dayNum = (dateStr.match(/\d+/)||[''])[0];
    const monthStr = dateStr.replace(/[A-Za-z]+,\s*/,'').replace(/\d+/,'').trim().slice(0,3) || 'TBD';
    return `
    <div class="appt-card">
      <div class="appt-date"><div class="d">${dayNum||'—'}</div><div class="m">${monthStr}</div></div>
      <div class="appt-info"><div class="who">${get('Provider')}</div><div class="what">${get('Time')} · bring ${(get('Bring')||'').toLowerCase()}</div></div>
      <button class="appt-cal-btn" style="background:none;border:none;font-size:19px;cursor:pointer;padding:2px 6px;" onclick="event.stopPropagation(); exportItemIcs('${a.id}')" title="Add to calendar">📅</button>
      ${trashBtnHTML(a.id, get('Provider') || 'this appointment')}
    </div>`;
  }).join('') : '';

  const othersHTML = others.length ? others.map(o=>{
    const icon = instrIcons[o.type] || '📋';
    return `
    <div class="instr-card">
      <div class="instr-head"><span class="icon">${icon}</span>${o.type}${trashBtnHTML(o.id, o.type)}</div>
      ${o.fields.map(f=>`<div class="instr-row"><span class="k">${f[0]}</span><span class="v">${f[1]}</span></div>`).join('')}
    </div>`;
  }).join('') : '';

  const firstAppt = appts[0];
  const alertText = firstAppt
    ? `📩 Text sent to family group: "Follow-up with ${(firstAppt.fields.find(f=>f[0]==='Provider')||[])[1]} is coming up — details are in Kin-Nect."`
    : `📩 Kin-Nect will text the family group automatically once an appointment is confirmed.`;

  const famAvatars = familyMembers.map(m=>`<div class="avatar" style="background:${avatarColorFor(m.name)};">${escapeHtml((m.name||'?').trim().charAt(0).toUpperCase())}</div>`).join('');
  const famNames = familyMembers.map(m=>m.name).join(', ').replace(/, ([^,]*)$/, ' & $1');

  return `
    ${setupTrackerHTML()}
    <h2 class="screen-title">${filteredName ? escapeHtml(filteredName) + "'s Care Plan" : 'Family Care Plan'}</h2>
    <p class="today-date">${formatFriendlyDate(today)}</p>
    <div class="fam-row">
      ${famAvatars}
      <span class="fam-label">${escapeHtml(famNames)} · shared plan</span>
    </div>
    ${filterHTML}

    <div class="stat-row">
      <div class="stat-tile"><div class="num">${tasksDone}/${schedRows.length}</div><div class="lbl">${isViewingToday ? 'Doses taken today' : 'Doses taken that day'}</div></div>
      <div class="stat-tile"><div class="num">${visibleItems.length}</div><div class="lbl">Items from your scans</div></div>
    </div>

    <div class="section-h">Medication checklist</div>
    ${dayNavHTML}
    ${medHTML}

    ${appts.length ? `<div class="section-h">Upcoming appointments</div>${apptHTML}` : ''}

    ${others.length ? `<div class="section-h">Care instructions</div>${othersHTML}` : ''}

    <div class="alert-box">${alertText}</div>
    <div style="height:20px"></div>
  `;
}

// ---------- Shared schedule editor (times / days / duration) ----------
// Used both by the "Edit schedule" modal on an already-confirmed dashboard
// item and by the manual-entry form for a brand-new one — same draft
// object, same rendering function, so behavior stays identical in both
// places instead of drifting into two slightly different implementations.
let scheduleDraft = null;
function cloneSchedule(sched){
  return sched ? JSON.parse(JSON.stringify(sched)) : defaultScheduleFor();
}
function renderScheduleEditor(containerId){
  const el = document.getElementById(containerId);
  if(!el || !scheduleDraft) return;
  const d = scheduleDraft;
  const isInterval = d.mode === 'interval';
  const timesHTML = d.times.length
    ? d.times.map((t,i)=> isInterval
        ? `<span class="time-chip">${formatTimeLabel(t)}</span>`
        : `<span class="time-chip">${formatTimeLabel(t)}<span class="chip-x" onclick="removeDraftTime(${i})">✕</span></span>`
      ).join('')
    : `<span class="chip-empty">No times set yet</span>`;
  const allDays = d.days.length === 7;
  const daysHTML = DAY_LABELS.map((lbl,i)=>{
    const active = d.days.includes(i);
    return `<button type="button" class="day-toggle ${active?'active':''}" onclick="toggleDraftDay(${i})">${lbl}</button>`;
  }).join('');
  el.innerHTML = `
    <label class="edit-row-label">Times</label>
    <div class="day-toggle-row" style="margin-bottom:8px;">
      <button type="button" class="day-toggle ${!isInterval?'active':''}" onclick="setDraftMode('times')">Specific times</button>
      <button type="button" class="day-toggle ${isInterval?'active':''}" onclick="setDraftMode('interval')">Every X hours</button>
    </div>
    ${isInterval ? `
    <div class="duration-fixed-row">
      Every <input type="number" min="1" max="24" id="scheduleIntervalHours" value="${d.intervalHours||6}" onchange="setDraftInterval(this.value, null)" style="width:52px;" /> hours, starting
      <input type="time" id="scheduleIntervalStart" value="${d.intervalStart||nowTimeStr()}" onchange="setDraftInterval(null, this.value)" />
    </div>
    <div class="time-chip-row">${timesHTML}</div>
    <p class="chip-empty" style="margin:0 0 8px;">Kin-Nect spaces doses across 24 hours automatically from the start time.</p>
    ` : `
    <div class="time-chip-row">${timesHTML}</div>
    <div class="time-add-row">
      <input type="time" id="scheduleTimeInput" value="${nowTimeStr()}" />
      <button type="button" class="btn-small" onclick="addDraftTime()">+ Add time</button>
    </div>
    `}
    <label class="edit-row-label" style="margin-top:14px;">Days</label>
    <div class="day-toggle-row">
      <button type="button" class="day-toggle ${allDays?'active':''}" onclick="setDraftAllDays()">Every day</button>
    </div>
    <div class="day-toggle-row">${daysHTML}</div>
    <label class="edit-row-label" style="margin-top:14px;">Duration</label>
    <div class="duration-row">
      <label><input type="radio" name="durMode" ${d.durationMode==='ongoing'?'checked':''} onclick="setDraftDurationMode('ongoing')"/> Ongoing</label>
      <label><input type="radio" name="durMode" ${d.durationMode==='fixed'?'checked':''} onclick="setDraftDurationMode('fixed')"/> For a set number of days</label>
    </div>
    ${d.durationMode==='fixed' ? `
    <div class="duration-fixed-row">
      Starting <input type="date" id="scheduleStartDate" value="${d.startDate}" onchange="scheduleDraft.startDate=this.value" />
      for <input type="number" min="1" id="scheduleDurationDays" value="${d.durationDays||7}" onchange="scheduleDraft.durationDays=parseInt(this.value,10)||1" /> days
    </div>` : ''}
  `;
  // The verify screen's "Looks right" button needs to stay in sync with
  // whether a time has been set, without a full renderVerifyStep() (which
  // would wipe whatever's mid-edit here) — update it directly instead.
  if(containerId === 'vp-schedule-body'){
    const confirmBtn = document.querySelector('.btn-confirm');
    if(confirmBtn){
      const blocked = !d.times.length;
      confirmBtn.disabled = blocked;
      confirmBtn.textContent = blocked ? 'Add at least one time first' : '✓ Looks right';
    }
  }
}
function setDraftMode(mode){
  scheduleDraft.mode = mode;
  if(mode === 'interval'){
    if(!scheduleDraft.intervalHours) scheduleDraft.intervalHours = 6;
    if(!scheduleDraft.intervalStart) scheduleDraft.intervalStart = scheduleDraft.times[0] || nowTimeStr();
    scheduleDraft.times = computeIntervalTimes(scheduleDraft.intervalStart, scheduleDraft.intervalHours);
  }
  renderScheduleEditor(scheduleDraft.__containerId);
}
function setDraftInterval(hours, start){
  if(hours !== null && hours !== undefined && hours !== '') scheduleDraft.intervalHours = Math.max(1, Math.min(24, parseInt(hours,10)||6));
  if(start) scheduleDraft.intervalStart = start;
  scheduleDraft.times = computeIntervalTimes(scheduleDraft.intervalStart, scheduleDraft.intervalHours);
  renderScheduleEditor(scheduleDraft.__containerId);
}
function addDraftTime(){
  const input = document.getElementById('scheduleTimeInput');
  const val = input && input.value;
  if(!val) return;
  if(!scheduleDraft.times.includes(val)) scheduleDraft.times.push(val);
  scheduleDraft.times.sort();
  renderScheduleEditor(scheduleDraft.__containerId);
}
function removeDraftTime(i){
  scheduleDraft.times.splice(i,1);
  renderScheduleEditor(scheduleDraft.__containerId);
}
function toggleDraftDay(i){
  const idx = scheduleDraft.days.indexOf(i);
  if(idx === -1) scheduleDraft.days.push(i); else scheduleDraft.days.splice(idx,1);
  scheduleDraft.days.sort();
  renderScheduleEditor(scheduleDraft.__containerId);
}
function setDraftAllDays(){
  scheduleDraft.days = [0,1,2,3,4,5,6];
  renderScheduleEditor(scheduleDraft.__containerId);
}
function setDraftDurationMode(mode){
  scheduleDraft.durationMode = mode;
  renderScheduleEditor(scheduleDraft.__containerId);
}

// ---------- Edit schedule modal (tap a dashboard medicine to open) ----------

      <div class="edit-row">

      </div>
      <div class="edit-row">
        <label>Who's this for</label>

// A medicine has one shared schedule/frequency/person for every dose — there's
// no separate data for "just this one dose" — so a change here always applies
// to the whole series. This confirms that plainly before saving, rather than
// letting someone assume (reasonably!) that it might only affect today's dose.
function confirmSaveScheduleModal(itemId){
  const item = confirmedItems.find(i=>i.id===itemId);

  if(!scheduleDraft.times.length){

  }
  const name = itemDisplayName(item);
  const forWhomEl = document.getElementById('scheduleForWhomInput');
  const forMember = forWhomEl ? familyMembers.find(m=>m.id===forWhomEl.value) : null;
  const forName = forMember ? forMember.name : familyMemberName(item.forWhom);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'scheduleConfirmBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">
      <h3>Update all doses of ${escapeHtml(name)}?</h3>
      <p>There's one schedule for this medicine, not a separate one per dose — saving changes every upcoming dose${forName ? ` (for ${escapeHtml(forName)})` : ''} to match, not just today's.</p>

// ---------- Calendar export (.ics) — free, no account, no backend ----------
// Works the same for Outlook, Gmail/Google Calendar, and Apple Calendar:
// a standard .ics file downloads and the phone/computer offers to add it to
// whichever calendar app is already set up there.
function icsEscape(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
function icsLocalDateTime(dateStr, timeStr){
  return dateStr.replace(/-/g,'') + 'T' + timeStr.replace(':','') + '00';
}
function icsUntilFromStartDuration(startDate, durationDays){
  const d = new Date(startDate + 'T00:00:00');
  d.setDate(d.getDate() + durationDays - 1);
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T235959`;
}
function icsDtstampNow(){
  const n = new Date();
  return `${n.getUTCFullYear()}${pad2(n.getUTCMonth()+1)}${pad2(n.getUTCDate())}T${pad2(n.getUTCHours())}${pad2(n.getUTCMinutes())}${pad2(n.getUTCSeconds())}Z`;
}
const ICS_BYDAY = ['SU','MO','TU','WE','TH','FR','SA'];
// Shared by the .ics file (which embeds it per VEVENT) and the Google
// Calendar web link (which takes the identical string as its `recur` param)
// so both paths always agree on what "the whole series" means for this
// schedule — same days, same end date if it's a fixed-length course.
function buildRRuleString(sched){
  const days = (sched.days && sched.days.length) ? sched.days.slice().sort() : [0,1,2,3,4,5,6];
  const isDaily = days.length === 7;
  let rrule = isDaily ? 'RRULE:FREQ=DAILY' : `RRULE:FREQ=WEEKLY;BYDAY=${days.map(i=>ICS_BYDAY[i]).join(',')}`;
  if(sched.durationMode === 'fixed' && sched.durationDays){
    rrule += `;UNTIL=${icsUntilFromStartDuration(sched.startDate || todayStr(), sched.durationDays)}`;
  }
  return rrule;
}
function addMinutesToTime(time, minutesToAdd){
  const [h,m] = time.split(':').map(Number);
  let total = h*60 + m + minutesToAdd;
  total = ((total % (24*60)) + 24*60) % (24*60);
  return `${pad2(Math.floor(total/60))}:${pad2(total%60)}`;
}
function buildIcsForMedItem(item){
  const name = itemDisplayName(item);
  const freq = item.med ? item.med.frequency : ((item.fields.find(f=>f[0]==='Frequency')||[])[1] || '');
  const sched = item.schedule || defaultScheduleFor();
  const rrule = buildRRuleString(sched);
  const dtstamp = icsDtstampNow();
  const times = (sched.times && sched.times.length) ? sched.times : ['09:00'];
  const events = times.map((t,i)=>[
    'BEGIN:VEVENT',
    `UID:kinnect-${item.id}-${i}@kinnect.local`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${icsLocalDateTime(sched.startDate || todayStr(), t)}`,
    'DURATION:PT15M',
    rrule,
    `SUMMARY:${icsEscape('Take ' + name)}`,
    `DESCRIPTION:${icsEscape(freq || 'Reminder from Kin-Nect')}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Medication reminder',
    'TRIGGER:-PT0M',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n'));
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kin-Nect//Medication Reminders//EN','CALSCALE:GREGORIAN',...events,'END:VCALENDAR'].join('\r\n');
}
// Discharge-paper appointment dates/times are free-text OCR/demo fields
// ("Thu, Aug 13", "2:00 PM") rather than a real date object, so this is a
// best-effort parse — if it can't make sense of it, it falls back to
// "right now" rather than failing the whole export, and the caller is told
// so it can warn the user to double check the date once it's downloaded.
function parseApptDateTime(dateStr, timeStr){
  const year = new Date().getFullYear();
  const cleanedDate = (dateStr||'').replace(/^[A-Za-z]+,\s*/,'').trim();
  const guess = new Date(`${cleanedDate} ${year} ${timeStr || '9:00 AM'}`);
  if(!isNaN(guess.getTime())) return { date: guess, guessed:false };
  return { date: new Date(), guessed:true };
}
function buildIcsForAppointment(item){
  const get = k => (item.fields.find(f=>f[0]===k)||[])[1] || '';
  const provider = get('Provider') || 'Appointment';
  const { date, guessed } = parseApptDateTime(get('Date'), get('Time'));
  const dateStr = `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`;
  const timeStr = `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
  const dtstamp = icsDtstampNow();
  const bring = get('Bring');
  const body = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kin-Nect//Appointments//EN','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:kinnect-${item.id}@kinnect.local`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${icsLocalDateTime(dateStr, timeStr)}`,
    'DURATION:PT30M',
    `SUMMARY:${icsEscape('Appointment: ' + provider)}`,
    `DESCRIPTION:${icsEscape(bring ? ('Bring: ' + bring) : 'Kin-Nect appointment reminder')}`,
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Appointment reminder','TRIGGER:-PT60M','END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  return { content: body, guessed };
}
function downloadIcs(filename, content){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ if(a.parentNode) a.parentNode.removeChild(a); URL.revokeObjectURL(url); }, 1000);
}
function exportItemIcs(itemId){
  const item = confirmedItems.find(i=>i.id===itemId);
  if(!item) return;
  if(item.type === 'Follow-up Appointment'){
    const { content, guessed } = buildIcsForAppointment(item);
    downloadIcs('kinnect-appointment.ics', content);
    showToast(guessed ? "📅 Calendar file downloaded — double-check the date/time, it wasn't read automatically" : '📅 Calendar file downloaded — open it to add the reminder');
  } else {
    downloadIcs('kinnect-medication-reminder.ics', buildIcsForMedItem(item));
    showToast('📅 Calendar file downloaded — open it to add the reminder(s)');
  }
}
function downloadIcsForItem(itemId){
  const item = confirmedItems.find(i=>i.id===itemId);
  if(!item) return;
  downloadIcs('kinnect-medication-reminder.ics', buildIcsForMedItem(item));
  closeCalendarChoiceModal();
  showToast('📅 Calendar file downloaded — open it to add every dose, recurring for the whole course');
}
// Google's "render" quick-add URL genuinely supports a recur= RRULE, so one
// link there really does set up the whole repeating series — same RRULE
// string the .ics file uses. It can only carve out one clock-time per link,
// though, so a medicine with several doses a day needs one link per time.
function buildGoogleCalendarLink(item, time){
  const name = itemDisplayName(item);
  const freq = item.med ? item.med.frequency : ((item.fields.find(f=>f[0]==='Frequency')||[])[1] || '');
  const sched = item.schedule || defaultScheduleFor();
  const startDateStr = sched.startDate || todayStr();
  const startLocal = icsLocalDateTime(startDateStr, time);
  const endLocal = icsLocalDateTime(startDateStr, addMinutesToTime(time, 15));
  const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone) || 'UTC';
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: 'Take ' + name,
    dates: `${startLocal}/${endLocal}`,
    details: freq || 'Reminder from Kin-Nect',
    recur: buildRRuleString(sched),
    ctz: tz
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
// Outlook.com's compose deeplink doesn't have a documented recurrence
// parameter, so this only sets up a single one-time event at the given
// dose time — the modal says so plainly rather than implying it repeats.
function buildOutlookWebLink(item, time){
  const name = itemDisplayName(item);
  const freq = item.med ? item.med.frequency : ((item.fields.find(f=>f[0]==='Frequency')||[])[1] || '');
  const sched = item.schedule || defaultScheduleFor();
  const startDateStr = sched.startDate || todayStr();
  const endTime = addMinutesToTime(time, 15);
  const params = new URLSearchParams({
    subject: 'Take ' + name,
    startdt: `${startDateStr}T${time}:00`,
    enddt: `${startDateStr}T${endTime}:00`,
    body: freq || 'Reminder from Kin-Nect',
    allday: 'false'
  });
  return `https://outlook.live.com/calendar/0/deeplink/compose?${params.toString()}`;
}
// Lets someone pick where this medicine's reminders go instead of always
// forcing a raw .ics download — the .ics is still the only path that
// reliably carries the FULL recurring series (every dose time, for the
// whole course) since that's a real file a calendar app parses completely;
// the web links are a best-effort convenience for people who'd rather not
// download a file, with their real platform limits stated up front. NOTE:
// these URL formats are documented publicly but this sandbox can't click
// through an actual Google/Outlook account to confirm the live behavior —
// worth a quick real-world check the first time.
function showCalendarChoiceModal(itemId){

  const name = itemDisplayName(item);

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'calChoiceBackdrop';
  backdrop.innerHTML = `
    <div class="modal-sheet">

      <p>This is for the whole schedule — every upcoming dose, not just today's.</p>
      <button class="choice-btn" onclick="downloadIcsForItem('${itemId}')">⬇️ Download .ics — Apple Calendar, Outlook desktop, most calendar apps</button>
      <a class="choice-btn" style="display:block;text-decoration:none;box-sizing:border-box;" target="_blank" rel="noopener" href="${buildGoogleCalendarLink(item, repTime)}" onclick="closeCalendarChoiceModal()">🟦 Open in Google Calendar${multiTime ? ` (${formatTimeLabel(repTime)} dose)` : ''}</a>
      <a class="choice-btn" style="display:block;text-decoration:none;box-sizing:border-box;" target="_blank" rel="noopener" href="${buildOutlookWebLink(item, repTime)}" onclick="closeCalendarChoiceModal()">🟪 Open in Outlook.com${multiTime ? ` (${formatTimeLabel(repTime)} dose, one-time)` : ' (one-time, not recurring)'}</a>
      ${multiTime ? `<p class="age-hint" style="margin-top:8px;">This medicine has ${times.length} doses a day. The Google/Outlook web links can only set up one clock-time each — that's a limit of those services, not Kin-Nect. Download the .ics above to get every dose time at once, all recurring for the whole course.</p>` : `<p class="age-hint" style="margin-top:8px;">Heads up: Outlook's web link only adds a single one-time event — for a reminder that repeats automatically every day, use the .ics download or Google Calendar link above.</p>`}
      <button class="btn-modal-cancel" style="width:100%;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:2px;" onclick="closeCalendarChoiceModal()">Cancel</button>

// ---------- On-device reminders (Notification API + service worker) ----------
// Honest limitation, stated plainly in Settings too: this fires a
// notification while Kin-Nect is open, or was recently open, on THIS
// phone — it is not a real server-sent push and can't wake the app from
// fully closed. That needs a backend that knows about every family
// member's device, which is the next build phase.
let swRegistration = null;
let reminderTimer = null;
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{
    swRegistration = await navigator.serviceWorker.register('sw.js');
    return swRegistration;
  }catch(e){ console.error('Kin-Nect service worker registration failed:', e); return null; }
}
function isRemindersEnabled(){
  try{ return localStorage.getItem('kinnect-reminders-enabled') === '1'; }catch(e){ return false; }
}
async function toggleReminders(){
  if(isRemindersEnabled()){
    try{ localStorage.setItem('kinnect-reminders-enabled', '0'); }catch(e){}
    stopReminderLoop();
    renderScreen('settings');
    return;
  }
  if(!('Notification' in window)){ showToast('Notifications are not supported in this browser'); return; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ showToast('Notification permission was not granted'); return; }
  await registerServiceWorker();
  try{ localStorage.setItem('kinnect-reminders-enabled', '1'); }catch(e){}
  startReminderLoop();
  showToast('✓ On-device reminders turned on');
  renderScreen('settings');
}
function startReminderLoop(){
  if(reminderTimer) return;
  checkDueReminders();
  reminderTimer = setInterval(checkDueReminders, 60000);
}
function stopReminderLoop(){
  if(reminderTimer){ clearInterval(reminderTimer); reminderTimer = null; }
}
function fireDoseNotification(item, time){
  const name = itemDisplayName(item);
  const dose = item.med ? item.med.dose : ((item.fields.find(f=>f[0]==='Dose')||[])[1] || '');
  const body = `${formatTimeLabel(time)} dose${dose ? ' — ' + dose : ''}`;
  const title = `Time for ${name}`;
  if(swRegistration && swRegistration.showNotification){
    swRegistration.showNotification(title, { body, tag: item.id + '-' + time });
  } else if('Notification' in window && Notification.permission === 'granted'){
    new Notification(title, { body });
  }
}
// Checked every 60s while the app/tab is alive. Only notifies for a
// schedule slot once (tracked per item, per day, in notifiedLog — separate
// from takenLog), within a few minutes of it actually becoming due, and
// only for people who have push turned on in Family & sharing.
function checkDueReminders(){
  if(!isRemindersEnabled()) return;
  const now = new Date();
  const today = todayStr();
  let changed = false;
  confirmedItems.filter(i=>isSchedulableType(i.type)).forEach(item=>{
    const person = familyMembers.find(m=>m.id===item.forWhom);
    if(person && person.notifyPush === false) return;
    if(!isItemActiveOn(item, today)) return;
    const times = (item.schedule && item.schedule.times && item.schedule.times.length) ? item.schedule.times : ['09:00'];
    times.forEach(t=>{
      const key = today + '|' + t;
      if(item.takenLog && item.takenLog[key]) return;
      if(!item.notifiedLog) item.notifiedLog = {};
      if(item.notifiedLog[key]) return;
      const [h,m] = t.split(':').map(Number);
      const slot = new Date(today + 'T00:00:00');
      slot.setHours(h, m, 0, 0);
      const diffMin = (now.getTime() - slot.getTime()) / 60000;
      if(diffMin >= 0 && diffMin < 5){
        fireDoseNotification(item, t);
        item.notifiedLog[key] = true;
        changed = true;
      }
    });
  });
  if(changed) saveConfirmedItems();
}

    const r = await recognizeText(image);
    listScanText = cleanOcrText(r.text);
    if(r.engine === 'tesseract-fallback' || r.engine === 'none'){
      showToast('⚠ Used the on-device reader for this photo — text may be rough');
    }
  }catch(err){
    console.error('Kin-Nect list scan error:', err);
    listScanText = '';
    showToast('⚠️ Could not read this photo — you can still add items manually below');
  }
  listScanLoading = false;
  renderListReview(false);
}

const FAM_COLORS = ['#2a78d6','#1baf7a','#4a3aa7','#c9702e','#b6398f','#2c9aa3'];
function avatarColorFor(seed){
  let h = 0;
  const s = String(seed || '');
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return FAM_COLORS[h % FAM_COLORS.length];
}
// Push and calendar reminders are independent per person — a caregiver
// might want push, the care recipient themselves might want neither, and
// someone else might just want it on their calendar as a backup. Owner and
// Caregiver default to both on; Care recipient/Viewer default to both off,
// but every toggle can be changed per person regardless of role.
function defaultNotifyFor(role){
  const active = role === 'Owner' || role === 'Caregiver';
  return { notifyPush: active, notifyCalendar: active };
}
function defaultFamilyMembers(){
  return [
    Object.assign({ id:'seed-1', name:'Christos', role:'Owner', note:'Scans documents' }, defaultNotifyFor('Owner')),
    Object.assign({ id:'seed-2', name:'Sarah', role:'Caregiver', note:'Gets text alerts' }, defaultNotifyFor('Caregiver')),
    Object.assign({ id:'seed-3', name:'Mom', role:'Care recipient', note:'View only' }, defaultNotifyFor('Care recipient'))
  ];
}
function loadFamilyMembers(){
  try{
    const raw = localStorage.getItem('kinnect-family-members');
    if(!raw) return defaultFamilyMembers();
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed) || !parsed.length) return defaultFamilyMembers();
    // Backfill notify preferences for members saved by an older build that
    // didn't have this field yet.
    return parsed.map(m => Object.assign({}, defaultNotifyFor(m.role), m));
  }catch(e){ return defaultFamilyMembers(); }
}
function saveFamilyMembers(){
  try{ localStorage.setItem('kinnect-family-members', JSON.stringify(familyMembers)); }catch(e){}
}
let familyMembers = loadFamilyMembers();

function closeFamilyModal(){

}
function saveFamilyModal(memberId){
  const nameEl = document.getElementById('fam-name');
  const roleEl = document.getElementById('fam-role');
  const noteEl = document.getElementById('fam-note');
  const notifyPush = !!(document.getElementById('fam-notify-push')||{}).checked;
  const notifyCalendar = !!(document.getElementById('fam-notify-cal')||{}).checked;
  const name = (nameEl && nameEl.value || '').trim();
  if(!name){ showToast('Enter a name first'); return; }
  const role = roleEl ? roleEl.value : 'Caregiver';
  const note = (noteEl && noteEl.value || '').trim();
  if(memberId){
    const m = familyMembers.find(x => x.id === memberId);
    if(m){ m.name = name; m.role = role; m.note = note; m.notifyPush = notifyPush; m.notifyCalendar = notifyCalendar; }
    saveFamilyMembers();
    closeFamilyModal();
    showToast('✓ Updated');
    renderScreen('family');
  } else {
    const id = 'fam-' + Date.now() + '-' + Math.random().toString(36).slice(2,7);
    familyMembers.push({ id, name, role, note, notifyPush, notifyCalendar });
    saveFamilyMembers();
    markSetupStep('family-added');
    closeFamilyModal();
    renderScreen('family');
    // Show the placeholder invite code in its own follow-up modal — the
    // person is already added locally, this is just a preview of what
    // sharing would look like once real shared accounts exist.
    showInviteCodeModal(name);
  }
}

        <div class="label"><span id="vp-age-card-title">Which age range applies?</span></div>
        <p class="age-hint" id="vp-age-card-hint"></p>
        <div id="vp-age-body"></div>
      </div>
      <div class="extract-card" id="vp-schedule-card" style="display:none;">
        <div class="label"><span>When is this taken?</span></div>
        <p class="age-hint">Set it now so the dashboard is right from the start — defaults to today, ongoing, so you can just tap through if that's fine.</p>
        <div class="edit-row">
          <label>Frequency (label shown on the dashboard)</label>
          <input type="text" id="vp-schedule-freq" placeholder="e.g. Twice daily" />
        </div>
        <div id="vp-schedule-body"></div>
      </div>
      <div class="verify-actions">
        <button class="btn-confirm" onclick="confirmVerify()">✓ Looks right</button>
        <button class="btn-edit" onclick="openEditModal()">✎ Edit</button>
      </div>
    `;
  } else if(name === 'listreview'){
    bodyHTML = `<div id="listReviewBody">${listReviewBodyHTML()}</div>`;
  } else if(name === 'dashboard'){
    bodyHTML = dashboardBodyHTML();
  } else if(name === 'family'){
    bodyHTML = familyBodyHTML();
  } else if(name === 'settings'){
    bodyHTML = settingsBodyHTML();
  }

  const appEl = document.getElementById('app');
  appEl.innerHTML = `
    <div class="app-header">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="7" cy="12" r="4" fill="#2a78d6"/><circle cx="17" cy="12" r="4" fill="#1baf7a"/><path d="M10.5 12h3" stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round"/></svg>
        Kin-Nect
      </div>
      <div class="header-right">
        <button class="theme-header-btn" onclick="toggleTheme()" aria-label="Toggle dark mode">${theme === 'dark'
          ? '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="var(--ink-1)" stroke-width="1.8"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke="var(--ink-1)" stroke-width="1.6" stroke-linecap="round"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 0110.2 4a8.5 8.5 0 109.8 10.5z" stroke="var(--ink-1)" stroke-width="1.7" stroke-linejoin="round"/></svg>'
        }</button>
        <div class="avatar-mini">C</div>
      </div>
    </div>
    <div class="app-body">${bodyHTML}</div>
    ${footerHTML}
    ${showNav ? bottomNavHTML(activeNavKey) : ''}
  `;

  if(name==='upload'){ renderThumbGrid(); }
  if(name==='verify'){ renderVerifyStep(); }
}

// ---------- dark mode ----------
// Defaults to the phone's system setting, then remembers whatever the
// person picks in Settings (stored locally on their device only).
let theme = 'light';
try{
  const saved = localStorage.getItem('kinnect-theme');
  theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}catch(e){ /* localStorage unavailable — fall back to light */ }
function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', t === 'dark' ? '#1c1c1e' : '#fcfcfb');
  try{ localStorage.setItem('kinnect-theme', t); }catch(e){}
}
function toggleTheme(){
  applyTheme(theme === 'dark' ? 'light' : 'dark');
  renderScreen(currentScreen);
}
applyTheme(theme);

// init
renderScreen(currentScreen);
if(isRemindersEnabled()){
  registerServiceWorker().then(()=> startReminderLoop());
}

// ---------- boot splash ----------
// Shows briefly every time the app is opened/reloaded, like a device boot
// screen, then dismisses into the Home tab underneath (which has already
// rendered behind it, so there's no flash of blank content).
(function(){
  const splash = document.getElementById('splash');
  if(!splash) return;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const holdMs = reduceMotion ? 350 : 2500;
  setTimeout(()=>{
    splash.classList.add('splash-hide');
    setTimeout(()=> splash.remove(), 550);
  }, holdMs);
})();

// ---------- first-run onboarding intro ----------
// A one-time, catchy walkthrough of the 3-step flow (Add family / Scan /
// Create a schedule / Done!). Shown once ever, right after the boot splash
// (it sits at a lower z-index than #splash, so it's simply revealed as the
// splash fades — no extra timing to coordinate). Skippable any time; the
// same 3 steps are also tracked persistently on the Home tab via the
// setupTrackerHTML() card so someone who skips or doesn't finish in one
// sitting still gets guided through them.
const ONBOARD_STEPS = [
  { emoji:'👪', tag:'Step 1', title:'Add your family', sub:"Add the person you're caring for — and anyone helping out — so the plan is built around them.", bg:'linear-gradient(135deg, var(--blue), var(--blue-deep))' },
  { emoji:'📷', tag:'Step 2', title:'Scan a medicine', sub:'Snap a photo of a bottle, an OTC box, or discharge papers — Kin-Nect reads it for you.', bg:'linear-gradient(135deg, var(--aqua), var(--aqua-deep))' },
  { emoji:'🗓️', tag:'Step 3', title:'Create a schedule', sub:'Confirm what was scanned and Kin-Nect builds the dose times automatically.', bg:'linear-gradient(135deg, var(--violet), var(--blue-deep))' },
  { emoji:'🎉', tag:"You're set", title:'Done!', sub:"Your dashboard is ready — see what's due, check doses off, and keep the whole family in the loop.", bg:'linear-gradient(135deg, var(--good), #2f7a4d)' },
];
let onboardIntroIdx = 0;
function renderOnboardIntro(){
  const wrap = document.getElementById('onboardIntro');
  if(!wrap) return;
  wrap.innerHTML = `
    <button class="intro-skip" onclick="finishOnboardIntro()">Skip</button>
    <div class="intro-slides">
      ${ONBOARD_STEPS.map((s,i)=>`
        <div class="intro-slide ${i===onboardIntroIdx?'active':''}">
          <div class="intro-badge" style="background:${s.bg};">${s.emoji}</div>
          <div class="intro-step-tag">${s.tag}</div>
          <div class="intro-title">${s.title}</div>
          <p class="intro-sub">${s.sub}</p>
        </div>`).join('')}
    </div>
    <div class="intro-footer">
      <div class="intro-dots">${ONBOARD_STEPS.map((_,i)=>`<button class="intro-dot ${i===onboardIntroIdx?'active':''}" onclick="goToIntroSlide(${i})" aria-label="Slide ${i+1}"></button>`).join('')}</div>
      <button class="intro-next-btn" onclick="advanceOnboardIntro()">${onboardIntroIdx === ONBOARD_STEPS.length - 1 ? "Let's go →" : 'Next'}</button>
    </div>
  `;
}
function goToIntroSlide(i){ onboardIntroIdx = i; renderOnboardIntro(); }
function advanceOnboardIntro(){
  if(onboardIntroIdx < ONBOARD_STEPS.length - 1){ onboardIntroIdx++; renderOnboardIntro(); }
  else { finishOnboardIntro(); }
}
function finishOnboardIntro(){
  markSetupStep('intro-seen');
  const wrap = document.getElementById('onboardIntro');
  if(!wrap) return;
  wrap.classList.add('intro-hide');
  setTimeout(()=>{ wrap.hidden = true; wrap.innerHTML = ''; }, 450);
}
if(!hasSetupStep('intro-seen')){
  const introWrap = document.getElementById('onboardIntro');
  if(introWrap){ introWrap.hidden = false; renderOnboardIntro(); }
}
</script>
</body>
</html>
